/* ═══════════════════════════════════════
   READ AMAZAD PROFILES
═══════════════════════════════════════ */
function getAmazadProfiles(){
  // يرجع الـ cache المحمّل مسبقاً، أو يحاول localStorage كـ fallback فوري
  if(_cachedProfiles !== null) return _cachedProfiles;
  try{
    const rawLocalOnly = localStorage.getItem(LOCAL_ONLY_KEY);
    const localOnly = rawLocalOnly ? JSON.parse(rawLocalOnly) : [];
    const localOnlyArr = Array.isArray(localOnly) ? localOnly : (localOnly.profiles || []);

    const raw = localStorage.getItem("amazad_profiles") || localStorage.getItem("amazad_v1");
    const parsed = raw ? JSON.parse(raw) : [];
    const legacyArr = Array.isArray(parsed) ? parsed : (parsed.profiles || []);

    const ids = new Set(localOnlyArr.map(p=>String(p.saveId||p.id)));
    return [...localOnlyArr, ...legacyArr.filter(p=>!ids.has(String(p.saveId||p.id)))];
  } catch(e){ return []; }
}

function getProfileById(id){
  return getAmazadProfiles().find(p=>String(p.saveId||p.id)===String(id)) || null;
}

function getProfileTransforms(profileId){
  const p = getProfileById(profileId);
  if(!p) return [];
  const ids = p._transformIds || p._transforms?.map((_,i)=>i+1) || [];
  if(p._transformIds){
    return p._transformIds.map((tid,i)=>{
      const tp = getProfileById(tid);
      return { id: tid, label: tp?._transformLabel || `تحول ${i+1}`, profile: tp };
    }).filter(t=>t.profile);
  }
  // old _transforms array fallback
  return (p._transforms||[]).map((t,i)=>({
    id: i+1, label: t._transformLabel || `تحول ${i+1}`, profile: {...p,...t}
  }));
}

function getSideDefenses(tok){
  const lg = tok.lifeGrade || (getProfileById(tok.profileId)?.lifeGrade) || '';
  const classes = tok.classes || (getProfileById(tok.profileId)?.classes) || [];
  const hasNature = classes.some(c=>c.cls==='طبيعة');
  const isGrade4  = ['4','4 خاصة'].includes(lg);
  const isGrade5  = lg === '5';
  const hasSpec   = isGrade4 || isGrade5;

  // الدفاع المئوي الأساسي = ما في الـ token + الدفاعات المخصصة
  const base    = trunc1((tok.dmgReduce    ?? 0) + (tok._extraDmgReduce ?? 0));
  const defense = trunc1((tok.defense      ?? 0) + (tok._extraDefense   ?? 0));
  const trueDef = trunc1((tok.trueDefense  ?? tok.trueDef ?? 0) + (tok._extraTrueDef ?? 0));

  const side1 = hasSpec ? Math.floor(base * 0.5) : 0;
  // side2: درجة5 دائماً، درجة4 فقط مع طبيعة
  const side2 = (isGrade5 || (isGrade4 && hasNature)) ? Math.floor(base * 0.5) : 0;
  // side3: درجة5 + طبيعة فقط
  const side3 = (isGrade5 && hasNature) ? Math.floor(base * 0.5) : 0;

  return { side1, side2, side3, hasNature, isGrade4, isGrade5, hasSpec, base, defense, trueDef };
}


/* ═══════════════════════════════════════════════════════════════
   فرص الحظ / الحاسة السادسة / التجدد / الأعين  +  المبادرة وترتيب الأدوار
═══════════════════════════════════════════════════════════════ */
/* نفس منحنى البونس المحدود في المولّد (أول 10 كاملة، ثم ÷2 حتى 30، ÷4 حتى 50، ÷10 حتى 100، ÷20 فوقها) */
const cbCapped = (raw) => {
  const v = Math.max(0, Number(raw)||0);
  if(v<=10) return v;
  let c = 10;
  if(v<=30) c += (v-10)/2;
  else if(v<=50) c += 20/2 + (v-30)/4;
  else if(v<=100) c += 20/2 + 20/4 + (v-50)/10;
  else c += 20/2 + 20/4 + 50/10 + (v-100)/20;
  return Math.round(c*10)/10;
};
const CB_TIERS = ["متعلم","خبير","متقدم","متقن","أستاذ","قديس","نبوي","إلهي","بدائي","أزلي","متسيد"];
const REGEN_RACES_BF = ["بهائم الظلام","وحش الظلام"];

function cbProfile(tok){
  if(!tok) return null;
  try{ return getAmazadProfiles().find(x=>String(x.saveId||x.id)===String(tok.profileId)) || null; }catch(e){ return null; }
}
const cbStat = (p,name) => { const s=(p?.stats||[]).find(x=>x.name===name); return Number(s?.value)||0; };
const cbSkillTotal = (p,name) => {
  const list = p?.skills||[];
  const s = list.find(x=>x.name===name && (!x.isBarrier || cbIsRaceCustom(x))) || list.find(x=>x.name===name);
  return s ? (parseInt(s.bonus)||0)+(parseInt(s.extraBonus)||0) : 0;
};
const cbSkillStat = (p,name) => (p?.skills||[]).find(x=>x.name===name)?.stat || null;

function getTokBarrier(tok){ return tok?.barrierBinding || cbProfile(tok)?.barrierBinding || null; }
/* درجة ربط الحاجز بالبأس تُحسب حيّة من مستوى الشخصية ومستوى الحاجز (لا من نسخة مخزّنة قد تكون ناقصة أو قديمة).
   الدرجات تراكمية: ثالثة < ثانية < أولى < صفر */
function cbBarrierDegree(tok){
  const b = getTokBarrier(tok);
  const p = cbProfile(tok) || tok;
  const sk = (p?.skills||[]).find(s=>s.isBarrier && !s.isSakardBonus && !(s.isRaceSkill||s.isLimbSkill||s.isEyeSkill));
  let boundBas = barrierBoundToBas(b);
  if(sk){
    const st = (Array.isArray(sk.bindingStats)&&sk.bindingStats.length) ? sk.bindingStats : [sk.bindingStat||sk.stat];
    boundBas = st.includes('البأس') || boundBas;
  }
  if(!boundBas) return null;
  const lvl = Number(p?.level ?? tok?.level);
  if(sk && !isNaN(lvl)){
    const lvls=['متعلم','خبير','متقدم','متقن','أستاذ','قديس','نبوي','إلهي','بدائي','أزلي'];
    const bi = lvls.indexOf(sk.level);
    if(lvl>=30 && bi>=8) return 'صفر';
    if(lvl>=20 && bi>=7) return 'أولى';
    if(lvl>=12 && bi>=5) return 'ثانية';
    if(lvl>=4)           return 'ثالثة';
    return null;
  }
  return (b && b.degree) || null;
}
const CB_DEG_RANK = {'ثالثة':1,'ثانية':2,'أولى':3,'صفر':4};
function barrierBoundToBas(b){ return !!b && (b.stat==='البأس' || (Array.isArray(b.stats) && b.stats.includes('البأس'))); }

/* ── التجدد (بهائم ووحوش الظلام): 10d5 + (بأس + متانة + تجدد) نرد، 5 + تجدد وجه؛ المجاني = محدود(التجدد) ÷ 3 ── */
function regenInfoFor(p){
  if(!p || !REGEN_RACES_BF.includes(p.race)) return null;
  /* مطابقة مرنة للأسماء (تجاهل «ال» والتشكيل والمسافات) + بحث احتياطي عن «التجدد» تحت أي مهارة أو كمهارة مستقلة */
  const nz = t => String(t||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/\s+/g,'').replace(/^ال/,'');
  const sk = (p.skills||[]).find(s=>nz(s.name)==='متانة' && !s.isBarrier) || (p.skills||[]).find(s=>nz(s.name)==='متانة');
  const stam = sk ? (parseInt(sk.bonus)||0)+(parseInt(sk.extraBonus)||0) : 0;
  let spec = sk ? (sk.specializations||[]).find(x=>nz(x.name)==='تجدد') : null;
  if(!spec){ for(const k of (p.skills||[])){ const sp=(k.specializations||[]).find(x=>nz(x.name)==='تجدد'); if(sp){ spec=sp; break; } } }
  if(!spec) spec = (p.skills||[]).find(x=>nz(x.name)==='تجدد') || null;
  const R = spec ? (parseInt(spec.bonus)||0)+(parseInt(spec.extraBonus)||0) : 0;
  const statV = sk ? cbStat(p, sk.stat || 'البأس') : 0;
  const capped = spec ? cbCapped(statV + stam + R) : 0;
  const bas = cbStat(p,'البأس');
  return { dice: 10 + bas + stam + R, faces: 5 + R, free: Math.floor(capped/3 + 1e-9), R, bas, stam, cost: 2 };
}
/* ── أعين الإتشيرما (البديه / البصير / العليم): متقن = استعمال مجاني، وكل مستوى فوقه +1 (أستاذ 2، قديس 3، نبوي 4 ...) ── */
const EYE_RE = /(بديه|بصير|عليم)/;
function eyeListFor(p){
  if(!p || p.race!=='إتشيرما') return [];
  const base = CB_TIERS.indexOf('متقن');
  return (p.skills||[]).filter(s=>EYE_RE.test(String(s.name||'')) && (!s.isBarrier || s.isEyeSkill) && !s.isLimbSkill).map(s=>{
    const idx = CB_TIERS.indexOf(s.level);
    return { name:s.name, level:s.level||null, max: idx>=base ? idx-base+1 : 0 };
  });
}
/* الحظ = ⌈سمة الحظ ÷ 2⌉، الحاسة السادسة = ⌈قيمة المهارة ÷ 2⌉ — تُحسب من الملف إن لم تكن القيم المخزّنة موجودة أو كانت صفراً */
function cbDerivedChances(p){
  const luckStat = Number((p?.stats||[]).find(s=>s.name==='الحظ')?.value) || 0;
  const ss = (p?.skills||[]).find(s=>s.name==='الحاسة السادسة');
  const ssVal = ss ? (parseInt(ss.bonus)||0)+(parseInt(ss.extraBonus)||0) : 0;
  return { luck: Math.ceil(luckStat/2), sixth: Math.ceil(ssVal/2) };
}
function applyDerivedChances(tok, p, force){
  p = p || cbProfile(tok); if(!p) return;
  if(force || tok.luckChancesMax===undefined){
    const dc = cbDerivedChances(p);
    const lMax = p.luckChancesMax || p.luckChances || dc.luck;
    const sMax = p.sixthSenseChancesMax || p.sixthSenseChances || dc.sixth;
    tok.luckChancesMax = lMax;
    tok.luckChances = (p.luckChances!=null && p.luckChances>0) ? Math.min(p.luckChances,lMax) : lMax;
    tok.sixthSenseChancesMax = sMax;
    tok.sixthSenseChances = (p.sixthSenseChances!=null && p.sixthSenseChances>0) ? Math.min(p.sixthSenseChances,sMax) : sMax;
  }
  const rg = regenInfoFor(p);
  if(rg && (force || tok.regenChancesMax===undefined)){
    tok.regenChances = rg.free; tok.regenChancesMax = rg.free; tok.regen = {dice:rg.dice, faces:rg.faces, free:rg.free, R:rg.R};
  }
  if(p.race==='إتشيرما' && (force || !Array.isArray(tok.eyes))){
    const old = Array.isArray(tok.eyes) ? tok.eyes : [];
    tok.eyes = eyeListFor(p).map(e=>{
      const prev = old.find(o=>o.name===e.name) || (tok.eyeType===e.name && tok.eyeChances!==undefined ? {cur:tok.eyeChances} : null);
      return { name:e.name, max:e.max, cur: (!force && prev) ? Math.min(prev.cur, e.max) : e.max };
    });
  }
}
const CHANCE_KEYS = {
  luck:  ['luckChances','luckChancesMax'],
  sixth: ['sixthSenseChances','sixthSenseChancesMax'],
  regen: ['regenChances','regenChancesMax'],
};
function renderChancesHTML(tok){
  // إصلاح الرموز المحفوظة سابقاً بقيمة صفرية خاطئة (مرة واحدة لكل رمز)
  if(!tok._chFix2){
    tok._chFix2 = true;
    const p0 = cbProfile(tok);
    if(p0){
      const dc = cbDerivedChances(p0);
      if(!(tok.luckChancesMax>0) && dc.luck>0){ tok.luckChancesMax = dc.luck; tok.luckChances = dc.luck; }
      if(!(tok.sixthSenseChancesMax>0) && dc.sixth>0){ tok.sixthSenseChancesMax = dc.sixth; tok.sixthSenseChances = dc.sixth; }
    }
  }
  if(tok.regenChancesMax===undefined || (tok.race==='إتشيرما' && !Array.isArray(tok.eyes))) applyDerivedChances(tok, null, false);
  const box = (key,label,color) => {
    const [c,m] = CHANCE_KEYS[key];
    return `<div class="chance-box">
      <span class="lb" style="color:${color}">${label}</span>
      <button onclick="adjustChance('${tok.id}','${key}',-1)" title="استعمال فرصة">−</button>
      <span class="ct" style="color:${color}">${tok[c]||0}/${tok[m]||0}</span>
      <button onclick="adjustChance('${tok.id}','${key}',1)" title="استرجاع فرصة">+</button>
    </div>`;
  };
  let h = '';
  h += box('luck','🍀 فرص الحظ','#22c55e');
  h += box('sixth','👁 فرص الحاسة السادسة','#e879f9');
  const rgLive = REGEN_RACES_BF.includes(tok.race) ? regenInfoFor(cbProfile(tok)) : null;   // دائماً من الملف الحالي لا من نسخة قديمة مخزّنة على الشخصية
  if(rgLive) tok.regen = {...(tok.regen||{}), dice:rgLive.dice, faces:rgLive.faces, R:rgLive.R, free:rgLive.free, bas:rgLive.bas, stam:rgLive.stam};
  if(tok.regen && REGEN_RACES_BF.includes(tok.race)){
    h += box('regen','🩸 فرص التجدد (مجانية)','#f87171');
    h += `<div class="chance-box" style="margin-top:-2px;">
      <span class="lb" style="font-size:9px;color:var(--muted);">نرد التجدد <b style="color:#fca5a5;direction:ltr;display:inline-block">${tok.regen.dice}d${tok.regen.faces}</b> • 10 + بأس ${tok.regen.bas??'؟'} + متانة ${tok.regen.stam??'؟'} + تجدد ${tok.regen.R||0} • بعد المجانية: ${2} ستامينا</span>
      <button style="width:auto;padding:0 8px;font-size:10px;" onclick="useRegen('${tok.id}')">🩸 تجديد</button>
    </div>`;
  }
  if(tok.race==='إتشيرما') (tok.eyes||[]).forEach((e,i)=>{ if((e.max||0)>0) h += `<div class="chance-box">
      <span class="lb" style="color:#38bdf8">👁 فرص ${e.name} (مجانية)</span>
      <button onclick="adjustEye('${tok.id}',${i},-1)" title="استعمال فرصة">−</button>
      <span class="ct" style="color:#38bdf8">${e.cur||0}/${e.max||0}</span>
      <button onclick="adjustEye('${tok.id}',${i},1)" title="استرجاع فرصة">+</button>
    </div>`; });
  return h ? `<div style="margin-top:8px;">${h}</div>` : '';
}
function refreshChances(tokId){
  const tok = state.tokens.find(t=>t.id===tokId); const el = document.getElementById('chances-'+tokId);
  if(tok && el) el.innerHTML = renderChancesHTML(tok);
}
function adjustChance(tokId,key,d){
  const tok = state.tokens.find(t=>t.id===tokId); if(!tok || !CHANCE_KEYS[key]) return;
  const [c,m] = CHANCE_KEYS[key];
  if(d>0 && (tok[m]||0)===0 && (key==='luck'||key==='sixth')){ tok[m] = 1; tok[c] = 0; }   // شخصية بلا فرص: أول + يمنحها فرصة ويُرفع السقف
  tok[c] = Math.max(0, Math.min(tok[m]||0, (tok[c]||0)+d));
  refreshChances(tokId); saveBfState();
}
function adjustEye(tokId,i,d){
  const tok = state.tokens.find(t=>t.id===tokId); const e = tok?.eyes?.[i]; if(!e) return;
  e.cur = Math.max(0, Math.min(e.max||0, (e.cur||0)+d));
  refreshChances(tokId); saveBfState();
}
function useRegen(tokId){
  const tok = state.tokens.find(t=>t.id===tokId); if(!tok) return;
  const live = regenInfoFor(cbProfile(tok));
  if(live) tok.regen = {...(tok.regen||{}), dice:live.dice, faces:live.faces, R:live.R, free:live.free, bas:live.bas, stam:live.stam};
  if(!tok.regen) return;
  const f = `!roll ${tok.regen.dice}d${tok.regen.faces}`;
  if((tok.regenChances||0) > 0){
    tok.regenChances -= 1;
    showToast(`🩸 تجديد مجاني — ${f}`);
  } else {
    if((tok.stamina||0) < 2){ showToast('⚠ ستامينا غير كافية (يلزم 2)'); return; }
    tok.stamina = trunc1(tok.stamina - 2);
    showToast(`🩸 تجديد: −2 ستامينا — ${f}`);
  }
  try{ navigator.clipboard?.writeText(f)?.catch?.(()=>{}); }catch(e){}
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.remove(); renderToken(tok); }
  refreshPopupBars(tokId); refreshChances(tokId); saveBfState();
}

/* ═══════════ المبادرة وترتيب الأدوار ═══════════ */
const CB_DICE = {
  speed:   {label:'1d30 + قوة + سرعة',        stat:'القوة',   skill:'السرعة'},
  dex:     {label:'1d30 + براعة + خفة يد',    stat:'البراعة', skill:'خفة اليد'},
  int:     {label:'1d30 + ذكاء + يقظة',       stat:'الذكاء',  skill:'اليقظة'},
  barrier: {label:'1d30 + سمة الحاجز'},
  custom:  {label:'نرد مخصص (مهارات تختارها)'},
};
const CB_INT_PERK_MINS = [12,15,20,30,50];   // ميزات الذكاء بعد العاشرة: كل واحدة +2.5 أفضلية مبادرة
let cbIntUi = { open:false, sel:[], faces:{} };
let cbMinimized = false;

function cbC(){
  if(!state.combat || typeof state.combat!=='object') state.combat = {};
  const C = state.combat;
  if(!Array.isArray(C.parts)) C.parts = [];
  if(!Array.isArray(C.order)) C.order = [];
  if(!Array.isArray(C.cancelled)) C.cancelled = [];
  if(!Array.isArray(C.log)) C.log = [];
  if(typeof C.cycle!=='number') C.cycle = 0;
  if(typeof C.current!=='number') C.current = -1;
  if(typeof C.seq!=='number') C.seq = 1;
  return C;
}
const cbTok = (id) => state.tokens.find(t=>t.id===id);
const cbName = (id) => cbTok(id)?.name || '؟';
function cbLog(msg){ const C=cbC(); C.log.unshift(msg); if(C.log.length>40) C.log.length=40; }

function cbIntAdv(p){
  const v = cbStat(p,'الذكاء');
  if(v < 10) return 0;
  return 5 + 2.5 * CB_INT_PERK_MINS.filter(m=>v>=m).length;
}
/* «الحاجز» الحقيقي فقط — مهارات النواة وأعضاء التنانين وأعين الإتشيرما مخزّنة بعلامة isBarrier لكنها مهارات عرقية مخصصة وليست حاجزاً */
const cbIsRaceCustom = (s) => !!(s && (s.isRaceSkill || s.isLimbSkill || s.isEyeSkill));
const cbIsTrueBarrier = (s) => !!(s && s.isBarrier && !s.isSakardBonus && !cbIsRaceCustom(s));
function cbBarrierInfo(p){
  const sk = (p?.skills||[]).find(cbIsTrueBarrier);
  if(!sk) return null;
  const b = p.barrierBinding;
  const names = (Array.isArray(sk.bindingStats) && sk.bindingStats.length) ? sk.bindingStats
    : (b && Array.isArray(b.stats) && b.stats.length) ? b.stats : [ (b&&b.stat) || sk.bindingStat || sk.stat ];
  const statV = Math.max(0, ...names.filter(Boolean).map(n=>cbStat(p,n)));
  const total = (parseInt(sk.bonus)||0)+(parseInt(sk.extraBonus)||0);
  return { names, statV, total, skillName: sk.name };
}
/* بونس النرد المحدود: محدود(السمة + المهارة) — وللنرد المخصص: محدود(سمات المهارات المختارة + مجموع قيمها) مرة واحدة */
function cbDieBonus(p, key, skills){
  if(!p) return {capped:0, text:'لا ملف شخصية'};
  if(key==='barrier'){
    const bi = cbBarrierInfo(p);
    if(!bi) return {capped:0, text:'لا حاجز'};
    const raw = bi.statV + bi.total;
    return {capped: cbCapped(raw), text:`محدود(${bi.names.join('/')} ${bi.statV} + ${bi.skillName} ${bi.total}) = ${cbCapped(raw)}`};
  }
  if(key==='custom'){
    const list = (skills||[]).filter(Boolean);
    if(!list.length) return {capped:0, text:'لم تُحدَّد مهارات'};
    const stats = [...new Set(list.map(n=>cbSkillStat(p,n)).filter(Boolean))];
    const raw = stats.reduce((a,n)=>a+cbStat(p,n),0) + list.reduce((a,n)=>a+cbSkillTotal(p,n),0);
    return {capped: cbCapped(raw), text:`محدود(${stats.join('+')||'—'} + ${list.join('+')} ← ${raw}) = ${cbCapped(raw)}`};
  }
  const d = CB_DICE[key] || CB_DICE.speed;
  const raw = cbStat(p,d.stat) + cbSkillTotal(p,d.skill);
  return {capped: cbCapped(raw), text:`محدود(${d.stat} ${cbStat(p,d.stat)} + ${d.skill} ${cbSkillTotal(p,d.skill)}) = ${cbCapped(raw)}`};
}
/* مجموع نرد واحد لشخصية بوجه معيّن */
function cbDieTotal(part, which, face){
  const tok = cbTok(part.tokId), p = cbProfile(tok);
  const key = which===1 ? part.die : part.die2, sk = which===1 ? part.skills : part.skills2;
  const adv = Number(which===1 ? part.adv : part.adv2)||0;
  const b = cbDieBonus(p, key, sk), ia = cbIntAdv(p);
  return { face, bonus:b.capped, text:b.text, intAdv:ia, adv, total: face==null ? null : trunc1(face + b.capped + ia + adv) };
}
function cbPartValue(part, f1, f2){
  const d1 = cbDieTotal(part,1,f1);
  if(!part.two) return {value:d1.total, nat:f1, d1, d2:null};
  const d2 = cbDieTotal(part,2,f2);
  if(d1.total==null || d2.total==null) return {value:null, nat:null, d1, d2};
  return d2.total < d1.total ? {value:d2.total, nat:f2, d1, d2} : {value:d1.total, nat:f1, d1, d2};   // الأسوأ
}
const cbRollFace = () => 1 + Math.floor(Math.random()*30);

function cbEnsurePart(tokId){
  const C = cbC();
  let pt = C.parts.find(x=>x.tokId===tokId);
  if(pt) return pt;
  const p = cbProfile(cbTok(tokId));
  pt = { tokId, die: cbBarrierInfo(p) ? 'barrier' : 'speed', skills:[], adv:0, two:false, die2:'speed', skills2:[], adv2:0, face1:null, face2:null };
  C.parts.push(pt);
  return pt;
}
function cbAddPart(){
  const sel = document.getElementById('cb-add-sel'); if(!sel || !sel.value) return;
  cbEnsurePart(sel.value); saveBfState(); renderCombatPanel();
}
function cbAddAll(){ state.tokens.forEach(t=>cbEnsurePart(t.id)); saveBfState(); renderCombatPanel(); }
function cbRemovePart(tokId){
  const C = cbC();
  C.parts = C.parts.filter(x=>x.tokId!==tokId);
  cbDropFromOrder(tokId);
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}
function cbDropFromOrder(tokId){
  const C = cbC(); const curId = C.order[C.current]?.id;
  C.order = C.order.filter(e=>e.tokId!==tokId);
  C.current = curId ? C.order.findIndex(e=>e.id===curId) : -1;
  if(C.current<0 && C.order.length) C.current = C.order.findIndex(e=>!e.played);
}
function combatOnTokenRemoved(tokId){
  const C = cbC();
  C.parts = C.parts.filter(x=>x.tokId!==tokId);
  cbDropFromOrder(tokId);
  if(document.getElementById('combat-panel')?.hidden===false) renderCombatPanel();
}
function cbSetField(tokId, field, val){
  const pt = cbC().parts.find(x=>x.tokId===tokId); if(!pt) return;
  if(field==='adv'||field==='adv2') pt[field] = Number(val)||0;
  else if(field==='face1'||field==='face2'){ const n = parseInt(val); pt[field] = (isFinite(n) && n>=1 && n<=30) ? n : null; }
  else if(field==='two') pt.two = !!val;
  else pt[field] = val;
  saveBfState(); renderCombatPanel();
}
function cbToggleSkill(tokId, which, name){
  const pt = cbC().parts.find(x=>x.tokId===tokId); if(!pt) return;
  const k = which===1 ? 'skills' : 'skills2';
  pt[k] = pt[k].includes(name) ? pt[k].filter(s=>s!==name) : [...pt[k], name];
  saveBfState(); renderCombatPanel();
}
function cbRoll(tokId, which){
  const pt = cbC().parts.find(x=>x.tokId===tokId); if(!pt) return;
  if(which===0){ pt.face1 = cbRollFace(); if(pt.two) pt.face2 = cbRollFace(); }
  else pt['face'+which] = cbRollFace();
  saveBfState(); renderCombatPanel();
}
function cbRollAll(){
  cbC().parts.forEach(pt=>{ pt.face1 = cbRollFace(); pt.face2 = pt.two ? cbRollFace() : null; });
  saveBfState(); renderCombatPanel();
}

/* ── بناء ترتيب الدورة ── */
function cbBuildOrder(){
  const C = cbC();
  const items = [], notes = [];
  C.parts.forEach(pt=>{
    const pv = cbPartValue(pt, pt.face1, pt.face2);
    if(pv.value==null){ notes.push(`⚠ ${cbName(pt.tokId)}: لم يُرمَ نرده بعد`); return; }
    items.push({ tokId:pt.tokId, value:pv.value, nat:pv.nat, intv: cbStat(cbProfile(cbTok(pt.tokId)),'الذكاء') });
  });
  if(!items.length){ showToast('⚠ ارمِ نرود المشاركين أولاً'); renderCombatPanel(); return; }
  const removed = items.filter(i=>i.nat===1);                               // 30/1: يُطرد من الدورة
  const nat30s  = items.filter(i=>i.nat===30 && i.nat!==1);
  const special = nat30s.length===1 ? nat30s[0] : null;                     // أكثر من 30 واحد: تُلغى الأفضلية عن الجميع
  if(nat30s.length>1) notes.push('30 طبيعي لأكثر من شخص: عوملت كنرد عادي');
  const normal  = items.filter(i=>i.nat!==1 && i!==special);

  const entries = []; const turnCount = {};
  normal.forEach(it=>{
    const others = normal.filter(o=>o!==it);
    let k = 0;
    if(others.length){ const minO = Math.min(...others.map(o=>o.value)); k = Math.max(0, Math.floor((it.value-minO)/15 + 1e-9)); }
    turnCount[it.tokId] = 1 + k;
    entries.push({tokId:it.tokId, value:it.value, intv:it.intv, kind:'main'});
    for(let j=1;j<=k;j++) entries.push({tokId:it.tokId, value:trunc1(it.value-15*j), intv:it.intv, kind:'extra'});
  });
  entries.forEach(e=>{ e.turns = turnCount[e.tokId]; });
  entries.sort((a,b)=> b.value-a.value || b.intv-a.intv || a.turns-b.turns);

  // التعادل: الأعلى ذكاءً، ثم الأقل أدواراً، وإن تطابقا كلياً يُلغى دوراهما (توتر/ارتياب)
  const cancelled = [], kept = [];
  entries.forEach(e=>{
    const twin = entries.some(o=>o!==e && o.value===e.value && o.tokId!==e.tokId && o.intv===e.intv && o.turns===e.turns);
    if(twin) cancelled.push({tokId:e.tokId, value:e.value, reason:'تعادل تام (ذكاء وأدوار): ألغي الدوران'}); else kept.push(e);
  });

  const seq = () => 'e'+(C.seq++);
  const order = [];
  if(special){
    order.push({id:seq(), tokId:special.tokId, value:special.value, kind:'nat30', note:'30 طبيعي — الأول', played:false});
    order.push({id:seq(), tokId:special.tokId, value:special.value, kind:'nat30free', note:'دور إضافي مجاني', played:false});
  }
  kept.forEach(e=>order.push({id:seq(), tokId:e.tokId, value:e.value, kind:e.kind, note:e.kind==='extra'?'دور إضافي (فرق 15+)':'', played:false}));
  removed.forEach(r=>cbLog(`💀 ${cbName(r.tokId)}: نرد 1 — طُرد من الدورة`));
  cancelled.forEach(c=>cbLog(`⊘ ${cbName(c.tokId)} (${fmt1(c.value)}): ${c.reason}`));
  notes.forEach(n=>cbLog(n));
  C.order = order; C.cancelled = cancelled; C.removed = removed.map(r=>r.tokId);
  C.current = order.length ? 0 : -1;
  cbIntUi = { open:false, sel:[], faces:{} };
  cbLog(`📋 رُتّبت أدوار الدورة ${C.cycle||1}: ${order.length} دور`);
  if(!C.cycle) C.cycle = 1;
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}

/* ── التحكم بالدور الحالي ── */
function combatCurrentTokId(){ const C=state.combat; return (C && C.order && C.order[C.current]) ? C.order[C.current].tokId : null; }
function highlightCurrentTurn(){
  const cur = combatCurrentTokId();
  document.querySelectorAll('.token').forEach(el=>el.classList.toggle('turn-active', !!cur && el.id==='tok_'+cur));
}
function cbSetCurrent(i){ const C=cbC(); if(i<0||i>=C.order.length) return; C.current=i; C.order[i].played=false; saveBfState(); renderCombatPanel(); highlightCurrentTurn(); }
function cbTogglePlayed(i){ const C=cbC(); if(!C.order[i]) return; C.order[i].played=!C.order[i].played; saveBfState(); renderCombatPanel(); }
function cbRemoveEntry(i){
  const C=cbC(); if(!C.order[i]) return;
  const curId=C.order[C.current]?.id; C.order.splice(i,1);
  C.current = curId ? C.order.findIndex(e=>e.id===curId) : -1;
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}
function cbNext(){
  const C=cbC(); if(!C.order.length){ showToast('⚠ لا توجد أدوار'); return; }
  if(C.order[C.current]) C.order[C.current].played = true;
  let nxt = -1;
  for(let i=C.current+1;i<C.order.length;i++){ if(!C.order[i].played){ nxt=i; break; } }
  if(nxt<0) nxt = C.order.findIndex(e=>!e.played);
  C.current = nxt;
  if(nxt<0){ cbLog(`✅ انتهت الدورة ${C.cycle||1}`); showToast('✅ انتهت الدورة — ابدأ دورة جديدة وارمِ المبادرة'); }
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}
function cbNewCycle(){
  const C=cbC();
  C.cycle = (C.cycle||0) + 1;
  C.parts.forEach(pt=>{ pt.face1=null; pt.face2=null; });
  C.order=[]; C.cancelled=[]; C.removed=[]; C.current=-1;
  cbIntUi = { open:false, sel:[], faces:{} };
  cbLog(`🔄 الدورة ${C.cycle}: ارمِ نرود المبادرة من جديد`);
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}
function cbResetAll(){
  if(!confirm('مسح كل بيانات القتال والمبادرة لهذه الجلسة؟')) return;
  state.combat = {cycle:0, parts:[], order:[], current:-1, log:[], cancelled:[], seq:1};
  cbIntUi = { open:false, sel:[], faces:{} };
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}

/* ── التدخل: نرد مبادرة بإعاقة −10 ضد الدور الحالي ومن بعده ── */
function cbToggleIntUi(){ cbIntUi.open = !cbIntUi.open; if(!cbIntUi.open) cbIntUi={open:false,sel:[],faces:{}}; renderCombatPanel(); }
function cbIntToggleSel(tokId){
  cbIntUi.sel = cbIntUi.sel.includes(tokId) ? cbIntUi.sel.filter(x=>x!==tokId) : [...cbIntUi.sel, tokId];
  renderCombatPanel();
}
function cbIntFace(tokId, which, val){
  const f = cbIntUi.faces[tokId] || (cbIntUi.faces[tokId]={});
  if(val==='roll') f['f'+which] = cbRollFace();
  else { const n=parseInt(val); f['f'+which] = (isFinite(n)&&n>=1&&n<=30) ? n : null; }
  renderCombatPanel();
}
function cbIntResult(tokId){
  const pt = cbEnsurePart(tokId);
  const f = cbIntUi.faces[tokId] || {};
  const pv = cbPartValue(pt, f.f1??null, pt.two ? (f.f2??null) : null);
  return pv.value==null ? null : trunc1(pv.value - 10);
}
function cbResolveIntervention(){
  const C = cbC();
  const list = cbIntUi.sel.filter(id=>cbTok(id) && !C.order.some(e=>e.tokId===id));
  if(!list.length){ showToast('⚠ اختر شخصية متدخلة'); return; }
  const rolled = list.map(id=>({tokId:id, res:cbIntResult(id)}));
  if(rolled.some(r=>r.res==null)){ showToast('⚠ ارمِ نرد كل متدخل أولاً'); return; }
  const intOf = id => cbStat(cbProfile(cbTok(id)),'الذكاء');
  rolled.sort((a,b)=> b.res-a.res || intOf(b.tokId)-intOf(a.tokId));

  const startIdx = Math.max(C.current, 0);
  const pend = [];
  C.order.forEach((e,i)=>{ if(i>=startIdx && !e.played) pend.push(i); });
  const win = [], guaranteed = [];
  rolled.forEach((r,i)=>{
    if(i >= pend.length){ guaranteed.push(r); return; }                   // أكثر من الأدوار المتبقية: دور مضمون في النهاية
    const target = C.order[pend[i]];
    if(r.res > target.value){ win.push({...r, target}); cbLog(`✋ ${cbName(r.tokId)} (${fmt1(r.res)}) تدخل ضد ${cbName(target.tokId)} (${fmt1(target.value)}) ونجح`); }
    else cbLog(`⛔ ${cbName(r.tokId)} (${fmt1(r.res)}) فشل ضد ${cbName(target.tokId)} (${fmt1(target.value)}) — ينتظر الدورة القادمة`);
  });
  const seq = () => 'e'+(C.seq++);
  const insertAt = pend.length ? pend[0] : C.order.length;
  const wins = win.map(w=>({id:seq(), tokId:w.tokId, value:w.res, kind:'intervene', note:`تدخل ضد ${cbName(w.target.tokId)}`, played:false}));
  C.order.splice(insertAt, 0, ...wins);
  win.forEach(w=>{ const e=C.order.find(x=>x.id===w.target.id); if(e) e.note = (e.note?e.note+' • ':'')+'مؤجَّل بسبب تدخل'; });
  guaranteed.forEach(g=>{ C.order.push({id:seq(), tokId:g.tokId, value:g.res, kind:'guaranteed', note:'دور مضمون — نهاية الدورة', played:false}); cbLog(`✓ ${cbName(g.tokId)}: تدخل مضمون في نهاية الدورة`); });
  if(wins.length) C.current = insertAt;
  cbIntUi = { open:false, sel:[], faces:{} };
  saveBfState(); renderCombatPanel(); highlightCurrentTurn();
}

/* ── الواجهة ── */
function toggleCombatPanel(){
  let el = document.getElementById('combat-panel');
  if(!el){ el = document.createElement('div'); el.id='combat-panel'; el.className='combat-panel'; el.hidden = true; document.body.appendChild(el); }
  el.hidden = !el.hidden;
  if(!el.hidden) renderCombatPanel();
}
function closeCombatPanel(){ const el=document.getElementById('combat-panel'); if(el) el.hidden=true; }
function cbMinToggle(){ cbMinimized = !cbMinimized; renderCombatPanel(); }

function renderCombatPanel(){
  const el = document.getElementById('combat-panel');
  if(!el || el.hidden) return;
  const C = cbC();
  const esc = (typeof _escS==='function') ? _escS : (s=>String(s));

    nat30free:'<span class="cb-badge nat">مجاني</span>', intervene:'<span class="cb-badge int">تدخل</span>', guaranteed:'<span class="cb-badge int">مضمون</span>'})[e.kind] || '';

  let h = `<div class="cb-title" style="font-size:13px;">

    </div>`;
  if(cbMinimized){
    const cur = C.order[C.current];

  // ── الأدوار ──
  h += `<div class="cb-sec"><div class="cb-title">📜 ترتيب الأدوار <span class="cb-sub">كل دور ≈ 1~3 ثوانٍ (يقدّرها الراوي)</span></div>`;
  if(!C.order.length) h += `<div class="cb-sub">لا يوجد ترتيب بعد: أضف المشاركين، ارمِ نرودهم ثم اضغط «ترتيب الأدوار».</div>`;

/* مدى السلاح حسب درجة «المدى» (1~8): نصف متر، متر، مترين، 3 أمتار، 50، 150، 500، أكثر من كيلومترين.
   الخلية = متر واحد (حجم الشخصية 170سم = 1.7 خلية). الافتراضي درجة 3 = مترين. */
const WEAPON_RANGE_METERS = [0.5, 1, 2, 3, 50, 150, 500, 2000];
const WEAPON_RANGE_TIER_LABELS = ['منخفض جدا','منخفض','متوسط','عالي','عالي جدا','خارق','خارق جدا','متسيد'];
const CELL_METERS = 1;
function weaponRangeCells(w){
  const explicit = parseFloat(w.rangeMeters ?? w.rangeCells);
  if(isFinite(explicit) && explicit>0) return explicit / CELL_METERS;
  if(w.rangeTier!=null){
    const tier = Math.max(1, Math.min(8, Math.round(Number(w.rangeTier)||3)));
    return WEAPON_RANGE_METERS[tier-1] / CELL_METERS;
  }
  const legacy = parseFloat(w.size);               // ملفات قديمة خزّنت المدى في size
  if(isFinite(legacy) && legacy>0) return legacy;
  return WEAPON_RANGE_METERS[2] / CELL_METERS;     // بلا درجة مخزَّنة: متوسط
}
const techRangeCells = (t) => {
  const v = parseFloat(t.finalSize ?? t.baseSize ?? (t.finalSpeed ? parseFloat(t.finalSpeed)/100 : NaN));
  return isFinite(v) && v>0 ? v : null;
};

function getTechniques(profileId){
  try{
    const profiles = getAmazadProfiles();
    const p = profiles.find(x=>(x.saveId||x.id)===profileId || String(x.saveId)===String(profileId));
    if(!p) return [];
    const techs = Array.isArray(p._savedTechniques) ? p._savedTechniques : [];
    // Also include weapons
    const weapons = (p.weapons||[]).map(w=>{
      const tier = w.rangeTier!=null ? Math.max(1,Math.min(8,Math.round(Number(w.rangeTier)||3))) : null;
      return {
        name: w.name||'سلاح',
        description: w.notes||'',
        _isWeapon: true,
        finalSize: weaponRangeCells(w),          // النطاق يتبع إحصائية المدى لا رقماً ثابتاً
        _rangeTierLabel: tier ? WEAPON_RANGE_TIER_LABELS[tier-1] : '',
        diceStr: w.damage||w.dice||'',
        Y: null,
      };
    });
    return [...techs, ...weapons];
  } catch(e){ return []; }
}

/* ═══════════════════════════════════════
   ATTACK RANGE VISUALIZATION
═══════════════════════════════════════ */
let attackRangeLayer = null;

let attackRangeState = null; // {tokId, r, cx, cy, svgEl, techName}

function showAttackRange(tokId, rangeInCells, techName){
  clearAttackRanges();
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  const _r0 = parseFloat(rangeInCells);
  const r = (isFinite(_r0) && _r0 > 0) ? Math.max(0.1, trunc1(_r0)) : 1;   // النطاق المرسوم = النطاق المعروض (مقتطع)
  // نقطة التوكن (tok.x, tok.y) هي مركز دائرته بالضبط، فيُرسم النطاق من قلبها
  const cx = tok.x, cy = tok.y;

  attackRangeState = {tokId, r, cx, cy, techName: techName||''};
  _drawAttackRange();
  _highlightTokensInRange();
}

/* سحب النطاق (ماوس ولمس): مستمعات النافذة تُسجَّل مرة واحدة فقط (كانت تتراكم مع كل إعادة رسم) */
let _rangeDrag = null;
window.addEventListener('pointermove', e=>{
  if(!_rangeDrag || !attackRangeState) return;
  attackRangeState.cx = _rangeDrag.startCX + (e.clientX-_rangeDrag.startMX)/state.zoom;
  attackRangeState.cy = _rangeDrag.startCY + (e.clientY-_rangeDrag.startMY)/state.zoom;
  _drawAttackRange();
  _highlightTokensInRange();
});
window.addEventListener('pointerup',     ()=>{ _rangeDrag = null; });
window.addEventListener('pointercancel', ()=>{ _rangeDrag = null; });

const _SVGNS = 'http://www.w3.org/2000/svg';
function _svgEl(tag, attrs, style){
  const e = document.createElementNS(_SVGNS, tag);
  Object.keys(attrs||{}).forEach(k=>e.setAttribute(k, attrs[k]));
  if(style) e.style.cssText = style;
  return e;
}

function _drawAttackRange(){
  if(!attackRangeState) return;
  const {r, cx, cy, techName, tokId} = attackRangeState;
  const px  = r * state.cellPx;
  const inv = 1 / state.zoom;            // عناصر الواجهة تبقى بحجم ثابت على الشاشة مهما كان التكبير

  if(attackRangeLayer) attackRangeLayer.remove();

  const svg = _svgEl('svg', {width: state.mapW || 9999, height: state.mapH || 9999},
    'position:absolute;top:0;left:0;overflow:visible;z-index:10;pointer-events:none;');

  const defs = _svgEl('defs');
  defs.innerHTML = `
    <filter id="rng-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>`;

  const glow = _svgEl('circle', {cx, cy, r:px+6, fill:'none', stroke:'rgba(239,68,68,0.4)', 'stroke-width':8, filter:'url(#rng-glow)'}, 'pointer-events:none;');

  // الدائرة الرئيسية — تستقبل السحب عند لمس حدودها فقط
  const circle = _svgEl('circle', {cx, cy, r:px, fill:'rgba(239,68,68,0.07)', stroke:'rgba(255,50,50,1)',
    'stroke-width':2.5, 'stroke-dasharray':'8 4', filter:'url(#rng-glow)'}, 'pointer-events:stroke;cursor:move;touch-action:none;');

  // نقطة المركز = قلب دائرة المهاجم
  const dot = _svgEl('circle', {cx, cy, r:6*inv, fill:'rgba(255,80,80,0.9)'}, 'pointer-events:all;cursor:move;touch-action:none;');

  const startDrag = e => {
    if(e.pointerType==='mouse' && e.button!==0) return;
    _rangeDrag = {startMX:e.clientX, startMY:e.clientY, startCX:attackRangeState.cx, startCY:attackRangeState.cy};
    e.stopPropagation(); e.preventDefault();
  };
  circle.addEventListener('pointerdown', startDrag);
  dot.addEventListener('pointerdown', startDrag);

  // ── أزرار أعلى النطاق: ⚔ العودة للهجمة | 💥 تطبيقها | ✕ إغلاق النطاق ──
  const gy = cy - px - 24*inv;
  const bar = _svgEl('g', {transform:`translate(${cx},${gy}) scale(${inv})`});
  const mkBtn = (x, icon, fill, title, fn) => {
    const g = _svgEl('g', {transform:`translate(${x},0)`}, 'pointer-events:all;cursor:pointer;');
    g.appendChild(_svgEl('circle', {r:14, fill:'rgba(10,12,24,0.92)', stroke:fill, 'stroke-width':2}));
    const tx = _svgEl('text', {x:0, y:1, fill:'#fff', 'font-size':14, 'font-weight':900, 'text-anchor':'middle', 'dominant-baseline':'middle'}, 'pointer-events:none;');
    tx.textContent = icon;
    const tt = _svgEl('title'); tt.textContent = title;
    g.appendChild(tx); g.appendChild(tt);
    ['pointerdown','mousedown','touchstart'].forEach(ev=>g.addEventListener(ev, e=>e.stopPropagation(), {passive:true}));
    g.addEventListener('click', e=>{ e.stopPropagation(); fn(); });
    return g;
  };
  bar.appendChild(mkBtn(-34, '⚔', '#f59e0b', 'العودة إلى الهجمة ومعلوماتها', returnToAttackFromRange));
  bar.appendChild(mkBtn(  0, '💥', '#22c55e', 'تطبيق الهجمة على الأهداف داخل النطاق', applyAttackFromRange));
  bar.appendChild(mkBtn( 34, '✕', '#ef4444', 'إغلاق النطاق', clearAttackRanges));

  const label = _svgEl('text', {x:cx, y:gy - 22*inv, fill:'#ff6060', 'font-size':12*inv, 'font-weight':800,
    'text-anchor':'middle', 'font-family':'inherit'}, 'pointer-events:none;');
  label.textContent = techName || '';

  const rangeLabel = _svgEl('text', {x:cx, y:cy + px + 16*inv, fill:'rgba(255,100,100,0.85)', 'font-size':10*inv,
    'font-weight':700, 'text-anchor':'middle'}, 'pointer-events:none;');
  rangeLabel.textContent = '← '+fmt1(r)+' خلية →';

  [defs, glow, circle, dot, label, rangeLabel, bar].forEach(n=>svg.appendChild(n));
  bfCanvas.appendChild(svg);
  attackRangeLayer = svg;
}

/* ── من النطاق إلى الهجمة ── */
function returnToAttackFromRange(){
  if(!attackRangeState) return;
  const el = document.getElementById('atk-launcher');
  if(el){
    el.style.display = '';
    el.style.zIndex = nextDmgZ();
    keepPopupInView(el);
  } else {
    openAttackLauncher(attackRangeState.tokId);
    const rd = document.getElementById('atk-range'); if(rd) rd.value = attackRangeState.r;
  }
}
function applyAttackFromRange(){
  if(!attackRangeState) return;
  if(!document.getElementById('atk-launcher')){
    returnToAttackFromRange();
    showToast('اضبط الضرر ثم اضغط «احسب الضرر» — الأهداف داخل النطاق تُختار تلقائياً');
    return;
  }
  // إن لم تُحدَّد أهداف: كل من داخل النطاق عدا المهاجم نفسه
  if(!window._atkTargets || window._atkTargets.size===0){
    const inside = (_highlightTokensInRange()||[]).filter(t=>t.id!==attackRangeState.tokId);
    window._atkTargets = new Set(inside.map(t=>t.id));
    document.querySelectorAll('#atk-targets-wrap .target-chip').forEach(c=>c.classList.remove('selected'));
    inside.forEach(t=>document.getElementById('target-'+t.id)?.classList.add('selected'));
  }
  if(window._atkTargets.size===0){
    returnToAttackFromRange();
    showToast('⚠ لا توجد شخصيات داخل النطاق');
    return;
  }
  const dmg  = parseFloat(document.getElementById('atk-dmg')?.value)||0;
  const tdmg = parseFloat(document.getElementById('atk-true-dmg')?.value)||0;
  if(!dmg && !tdmg){
    returnToAttackFromRange();
    showToast('أدخل قيمة الضرر ثم اضغط «احسب الضرر»');
    return;
  }
  launchDamageCalc();
}

function _highlightTokensInRange(){
  if(!attackRangeState) return;
  const {cx, cy, r} = attackRangeState;
  const rangePx = r * state.cellPx;
  // find tokens whose center is within range
  const inRange = state.tokens.filter(t=>{
    return Math.sqrt((t.x-cx)**2+(t.y-cy)**2) <= rangePx;
  });
  // flash tokens in range
  document.querySelectorAll('.token').forEach(el=>{
    const id = el.id.replace('tok_','');
    const hit = inRange.some(t=>t.id===id);
    const av = el.querySelector('.token-avatar') || el;
    av.style.outline = hit ? '3px solid #ef4444' : '';
    av.style.filter  = hit ? 'drop-shadow(0 0 8px #ef4444)' : '';
  });
  return inRange;
}

function clearAttackRanges(){
  if(attackRangeLayer){ attackRangeLayer.remove(); attackRangeLayer=null; }
  attackRangeState = null;
  _rangeDrag = null;
  document.querySelectorAll('.token').forEach(el=>{
    const av = el.querySelector('.token-avatar') || el;
    av.style.outline=''; av.style.filter='';
  });
}

function previewAttackRange(tokId, val){
  if(attackRangeState) showAttackRange(tokId, val, attackRangeState.techName);
}

function setCustomDef(tokId, key, val){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  tok[key] = trunc1(parseFloat(val)||0);
  saveBfState();
}

function loadTransformForToken(tokId, transformId){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  tok._activeTransformId = transformId || null;
  if(transformId){
    const tp = getProfileById(transformId);
    if(tp){
      tok.hp = tp.hp || tok.hp;
      tok.hpMax = tp.hpMax || tok.hpMax;
      tok.hala = tp.hala || tok.hala;
      tok.halaMax = tp.halaMax || tok.halaMax;
      tok.defense = tp.defense || tok.defense;
      tok.trueDefense = tp.trueDefense || tok.trueDefense;
      tok.dmgReduce = tp.dmgReduce || tok.dmgReduce;
      tok.immunity = tp.immunity || tok.immunity;
      tok.physStrPct = tp.physStrPct || tok.physStrPct;
      tok.charSize = tp.size || tok.charSize;
    }
  }
  renderTokens();
  saveBfState();
  closePopup(tokId);
  openBattlePopup(tokId);
}

function getStat(profile, name){
  if(!profile.stats) return 0;
  const s = profile.stats.find(s=>s.name===name);
  return s ? (s.value||0) : 0;
}

/* ═══════════════════════════════════════
   PAN & ZOOM
═══════════════════════════════════════ */
function setupPanZoom(){
  // Mouse
  bfWrap.addEventListener('mousedown', onPanStart);
  window.addEventListener('mousemove', onPanMove);
  window.addEventListener('mouseup',   onPanEnd);

  // Touch
  let lastTouchDist = 0;
  bfWrap.addEventListener('touchstart', e=>{
    if(e.touches.length===1){
      onPanStart(e.touches[0]);
    } else if(e.touches.length===2){
      lastTouchDist = getTouchDist(e.touches);
    }
  },{passive:false});
  bfWrap.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(e.touches.length===1){
      onPanMove(e.touches[0]);
    } else if(e.touches.length===2){
      const dist = getTouchDist(e.touches);
      if(lastTouchDist>0){
        const delta = (dist - lastTouchDist) * 0.005;
        const rect2 = bfWrap.getBoundingClientRect();
        const cx = ((e.touches[0].clientX + e.touches[1].clientX)/2) - rect2.left;
        const cy = ((e.touches[0].clientY + e.touches[1].clientY)/2) - rect2.top;
        const mapCX = (cx - state.pan.x) / state.zoom;
        const mapCY = (cy - state.pan.y) / state.zoom;
        const minZ2 = Math.min(rect2.width/(state.mapW||rect2.width), rect2.height/(state.mapH||rect2.height))*0.3;
        state.zoom = Math.max(minZ2, Math.min(3.0, state.zoom + delta));
        state.pan.x = cx - mapCX * state.zoom;
        state.pan.y = cy - mapCY * state.zoom;
        applyTransform();
      }
      lastTouchDist = dist;
    }
  },{passive:false});
  bfWrap.addEventListener('touchend', e=>{ onPanEnd(); lastTouchDist=0; });

  // Wheel zoom — toward cursor
  bfWrap.addEventListener('wheel', e=>{
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.1 : 0.909;
    const rect = bfWrap.getBoundingClientRect();
    applyZoomAt(e.clientX - rect.left, e.clientY - rect.top, factor);
    saveBfState();
  },{passive:false});

  // Click outside tokens deselects
  bfWrap.addEventListener('click', e=>{
    if(e.target===bfWrap || e.target===bfCanvas || e.target===mapImg || e.target===gridCanvas || e.target===document.getElementById('grid-svg')){
      selectToken(null);
      closeAllPopups();
    }
  });
}

function getTouchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

function applyZoomAt(px, py, factor){
  const minZ = getMinZoom();
  const newZ = Math.max(minZ, Math.min(5, state.zoom * factor));
  state.pan.x = px - (px - state.pan.x) * (newZ / state.zoom);
  state.pan.y = py - (py - state.pan.y) * (newZ / state.zoom);
  state.zoom  = newZ;
  applyTransform();
}
function getMinZoom(){
  if(!state.mapW||!state.mapH) return 0.03;
  // allow zoom-out until map appears at 1/3 of viewport
  const wz = bfWrap.clientWidth  / state.mapW / 3;
  const hz = bfWrap.clientHeight / state.mapH / 3;
  return Math.min(wz, hz, 0.03);
}

function onPanStart(e){
  if(state.tool !== 'move') return;
  isPanning = true;
  bfWrap.classList.add('panning');
  panStart = {x: e.clientX||e.pageX, y: e.clientY||e.pageY};
  panOrigin = {...state.pan};
}
function onPanMove(e){
  if(!isPanning) return;
  const cx = e.clientX||e.pageX||0;
  const cy = e.clientY||e.pageY||0;
  const sens = state.panSensitivity || 1.0;
  state.pan.x = panOrigin.x + (cx - panStart.x) * sens;
  state.pan.y = panOrigin.y + (cy - panStart.y) * sens;
  applyTransform();
  const rect = bfWrap.getBoundingClientRect();
  updateCoord(cx - rect.left, cy - rect.top);
}
function onPanEnd(){
  if(isPanning){ isPanning=false; bfWrap.classList.remove('panning'); saveBfState(); }
}

function updateCoord(clientX, clientY){
  if(!state.mapSrc){ document.getElementById('coord-display').textContent='—'; return; }
  const mapX = (clientX - state.pan.x) / state.zoom;
  const mapY = (clientY - state.pan.y) / state.zoom;
  const col  = Math.floor(mapX / state.cellPx);
  const row  = Math.floor(mapY / state.cellPx);
  document.getElementById('coord-display').textContent = `عمود ${col} — صف ${row}`;
}

function zoomIn(){
  const cx=bfWrap.clientWidth/2, cy=bfWrap.clientHeight/2;
  applyZoomAt(cx,cy,1.2); saveBfState();
}
function zoomOut(){
  const cx=bfWrap.clientWidth/2, cy=bfWrap.clientHeight/2;
  applyZoomAt(cx,cy,1/1.2); saveBfState();
}
/* ⊞ — fit map exactly in viewport */
function zoomFit(){
  if(!state.mapW||!state.mapH){zoomReset();return;}
  const zw = bfWrap.clientWidth  / state.mapW;
  const zh = bfWrap.clientHeight / state.mapH;
  state.zoom = Math.min(zw,zh) * 0.96;
  state.pan.x = (bfWrap.clientWidth  - state.mapW * state.zoom) / 2;
  state.pan.y = (bfWrap.clientHeight - state.mapH * state.zoom) / 2;
  applyTransform(); saveBfState();
}
/* ⊙ — reset to 1:1 centered */
function zoomReset(){
  state.zoom=1;
  if(state.mapW&&state.mapH){
    state.pan.x = Math.max(0, (bfWrap.clientWidth  - state.mapW)/2);
    state.pan.y = Math.max(0, (bfWrap.clientHeight - state.mapH)/2);
  } else {
    state.pan={x:0,y:0};
  }
  applyTransform(); saveBfState();
}

/* ═══════════════════════════════════════
   TOKEN DRAG
═══════════════════════════════════════ */
let tokenDragging = false;
let dragTokId = null;
let dragStartMouse = {x:0,y:0};
let dragStartPos   = {x:0,y:0};

function startTokenDrag(e, tokId){
  e.stopPropagation();
  const ev = e.touches ? e.touches[0] : e;
  tokenDragging = true;
  dragTokId = tokId;
  dragStartMouse = {x: ev.clientX, y: ev.clientY};
  const tok = state.tokens.find(t=>t.id===tokId);
  if(tok) dragStartPos = {x: tok.x, y: tok.y};
  selectToken(tokId);

  const onMove = ev2 => {
    if(!tokenDragging) return;
    const e2 = ev2.touches ? ev2.touches[0] : ev2;
    const dx = (e2.clientX - dragStartMouse.x) / state.zoom;
    const dy = (e2.clientY - dragStartMouse.y) / state.zoom;
    const tok2 = state.tokens.find(t=>t.id===dragTokId);
    if(!tok2) return;
    tok2.x = dragStartPos.x + dx;
    tok2.y = dragStartPos.y + dy;
    const el = document.getElementById('tok_'+dragTokId);
    if(el){ el.style.left = tok2.x+'px'; el.style.top = tok2.y+'px'; }
  };
  const onEnd = () => {
    if(!tokenDragging) return;
    tokenDragging = false;
    // snap to grid center
    snapTokenToGrid(dragTokId);
    saveBfState();
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onEnd);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onEnd);
    dragTokId = null;
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onEnd);
}

function snapTokenToGrid(tokId){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  const col = Math.round(tok.x / state.cellPx);
  const row = Math.round(tok.y / state.cellPx);
  tok.x = col * state.cellPx;
  tok.y = row * state.cellPx;
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.style.left = tok.x+'px'; el.style.top = tok.y+'px'; }
}

function moveToken(tokId, dCol, dRow){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  tok.x += dCol * state.cellPx;
  tok.y += dRow * state.cellPx;
  tok.x = Math.max(0, Math.min(state.mapW-1, tok.x));
  tok.y = Math.max(0, Math.min(state.mapH-1, tok.y));
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.style.left = tok.x+'px'; el.style.top = tok.y+'px'; }
  saveBfState();
  // refresh popup position
  if(battlePopupOpen && selectedTokenId===tokId){
    openBattlePopup(tokId, el);
  }
}

function refreshPopupBars(tokId){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok || !openPopups[tokId]) return;
  const hpPct   = tok.hpMax>0   ? Math.max(0,Math.min(100,(tok.hp/tok.hpMax)*100))        : 0;
  const halaPct = tok.halaMax>0  ? Math.max(0,Math.min(100,(tok.hala/tok.halaMax)*100))     : 0;
  const stPct   = tok.staminaMax>0?Math.max(0,Math.min(100,(tok.stamina/tok.staminaMax)*100)):0;
  const hpColor = hpPct>60?'#22c55e':hpPct>30?'#f59e0b':'#ef4444';
  const hpBar   = document.getElementById('bp-hp-bar-'+tokId);
  const hpVal   = document.getElementById('bp-hp-val-'+tokId);
  const haBar   = document.getElementById('bp-hala-bar-'+tokId);
  const haVal   = document.getElementById('bp-hala-val-'+tokId);
  const stBar   = document.getElementById('bp-sta-bar-'+tokId);
  const stVal   = document.getElementById('bp-sta-val-'+tokId);
  if(hpBar){ hpBar.style.width=hpPct+'%'; hpBar.style.background=hpColor; }
  if(hpVal) hpVal.innerHTML = bpValHTML(tok.hp, tok.hpMax);
  if(haBar) haBar.style.width=halaPct+'%';
  if(haVal) haVal.innerHTML = bpValHTML(tok.hala, tok.halaMax);
  if(stBar) stBar.style.width=stPct+'%';

}

function adjustStat(tokId, key, delta){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  const isMax = key.endsWith('Max');
  const base  = isMax ? key.slice(0,-3) : key;
  tok[key] = trunc1(Math.max(isMax ? 1 : 0, (tok[key]??0) + delta));
  // الحالية لا تتجاوز الأقصى أبداً (وعند إنقاص الأقصى تنزل الحالية معه)
  if(tok[base+'Max'] !== undefined) tok[base] = trunc1(Math.min(tok[base]??0, tok[base+'Max']));
  const curEl = document.getElementById('se-cur');
  const maxEl = document.getElementById('se-max');
  const maxLbl = document.getElementById('se-maxlabel');
  if(curEl) curEl.textContent = fmt1(tok[base]);
  if(maxEl) maxEl.textContent = fmt1(tok[base+'Max']);
  if(maxLbl) maxLbl.textContent = '/ ' + fmt1(tok[base+'Max']);
  // re-render token bar
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.remove(); renderToken(tok); }
  // refresh open popup bars live
  refreshPopupBars(tokId);
  saveBfState();
}

function adjustExtraBar(tokId, barIdx, delta){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok || !tok.extraBars || !tok.extraBars[barIdx]) return;
  const bar = tok.extraBars[barIdx];
  bar.current = trunc1(Math.max(0, Math.min(bar.max||0, (bar.current??bar.max??0) + delta)));
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.remove(); renderToken(tok); }
  if(openPopups[tokId]){ closePopup(tokId); openBattlePopup(tokId); }
  saveBfState();
}

function resetStats(tokId){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  tok.hp     = tok.hpMax;
  tok.hala   = tok.halaMax;
  tok.stamina= tok.staminaMax;
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.remove(); renderToken(tok); }
  refreshPopupBars(tokId);
  showToast('♻ تمت إعادة الإحصائيات');
  saveBfState();
}

function syncFromProfile(tokId){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok||!tok.profileId){ showToast('⚠ لا يوجد بروفايل مرتبط'); return; }
  const profiles = getAmazadProfiles();
  const p = profiles.find(x=>String(x.saveId||x.id)===String(tok.profileId));
  if(!p){ showToast('⚠ لم يُعثر على البروفايل'); return; }
  tok.hpMax            = p.hpMax || p.hp || tok.hpMax;
  tok.hp               = p.hpCurrent ?? tok.hpMax;
  tok.halaMax          = p.halaMax || p.hala || tok.halaMax;
  tok.hala             = p.halaCurrent ?? tok.halaMax;
  tok.staminaMax       = p.staminaMax || 100;
  tok.stamina          = p.staminaCurrent ?? tok.staminaMax;
  tok.defense          = p.defense       ?? 0;
  tok.trueDefense      = p.trueDefense   ?? p.trueDef ?? 0;
  tok.dmgReduce        = p.dmgReduce     ?? 0;
  tok.immunity         = p.immunity      ?? 0;
  tok.physStrPct       = p.physStrPct    ?? 0;
  tok.charSize         = p.charSize      ?? p.size ?? 170;
  tok.lifeGrade        = p.lifeGrade     || '';
  tok.classes          = p.classes       || [];
  tok.charSize         = p.size          || tok.charSize;
  tok.level            = p.level         || tok.level;
  tok.race             = p.race          || tok.race;
  tok.barrierBinding   = p.barrierBinding || null;
  applyDerivedChances(tok, p, true);
  tok.raceColor        = RC[p.race]      || tok.raceColor;
  // مزامنة بارات الصحة الإضافية
  if(p.extraHpBars && p.extraHpBars.length > 0){
    tok.extraBars = p.extraHpBars.map(b=>({
      id: b.id||Date.now()+Math.random(),
      label: b.label||'بار إضافي',
      color: b.color||'#f97316',
      current: b.current??b.max??100,
      max: b.max||100,
    }));
  }
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.remove(); renderToken(tok); }
  if(openPopups[tokId]){ closePopup(tokId); openBattlePopup(tokId); }
  showToast('🔄 تمت المزامنة الكاملة');
  saveBfState();
}

let cropState = {zoom:1, x:0, y:0, srcW:0, srcH:0};

function setupCropDrag(src, tokId){
  const img = document.getElementById('crop-img');
  if(!img) return;
  cropState = {zoom:1, x:0, y:0};
  const circle = document.getElementById('crop-circle');
  const cSize = 220;

  // load natural dimensions
  const tmpImg = new Image();
  tmpImg.onload = () => {
    cropState.srcW = tmpImg.naturalWidth;
    cropState.srcH = tmpImg.naturalHeight;
    // fit image into circle
    const fitZoom = Math.max(cSize/cropState.srcW, cSize/cropState.srcH);
    cropState.zoom = fitZoom;
    applyCropTransform();
  };
  tmpImg.src = src;

  let dragging = false, startX=0, startY=0, startCX=0, startCY=0;
  const onDown = e => {
    dragging=true;
    const ev = e.touches?e.touches[0]:e;
    startX=ev.clientX; startY=ev.clientY;
    startCX=cropState.x; startCY=cropState.y;
    e.preventDefault();
  };
  const onMove = e => {
    if(!dragging) return;
    const ev = e.touches?e.touches[0]:e;
    cropState.x = startCX + (ev.clientX-startX);
    cropState.y = startCY + (ev.clientY-startY);
    applyCropTransform();
    e.preventDefault();
  };
  const onUp = ()=>{ dragging=false; };
  circle.addEventListener('mousedown',onDown);
  circle.addEventListener('touchstart',onDown,{passive:false});
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:false});
  window.addEventListener('mouseup',onUp);
  window.addEventListener('touchend',onUp);
}

function applyCropTransform(){
  const img = document.getElementById('crop-img');
  if(!img) return;
  img.style.width  = (cropState.srcW * cropState.zoom) + 'px';
  img.style.height = (cropState.srcH * cropState.zoom) + 'px';
  img.style.left   = (110 - (cropState.srcW*cropState.zoom/2) + cropState.x) + 'px';
  img.style.top    = (110 - (cropState.srcH*cropState.zoom/2) + cropState.y) + 'px';
}

function cropAdjust(axis, delta){
  if(axis==='zoom') cropState.zoom = Math.max(0.05, cropState.zoom+delta);
  else if(axis==='x') cropState.x += delta;
  else if(axis==='y') cropState.y += delta;
  applyCropTransform();
}

function saveCrop(tokId){
  // draw circle-cropped canvas
  const cSize = 220;
  const canvas = document.createElement('canvas');
  canvas.width = cSize; canvas.height = cSize;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(cSize/2, cSize/2, cSize/2, 0, Math.PI*2);
  ctx.clip();
  const img = document.getElementById('crop-img');
  const w = cropState.srcW * cropState.zoom;
  const h = cropState.srcH * cropState.zoom;
  const x = 110 - (w/2) + cropState.x;
  const y = 110 - (h/2) + cropState.y;
  ctx.drawImage(img, x, y, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

  const tok = state.tokens.find(t=>t.id===tokId);
  if(tok){
    saveCharImage(tok.profileId||tok.id, dataUrl);
    // also cache on token itself for quick render
    tok._imgCache = dataUrl;
    const el = document.getElementById('tok_'+tokId);
    if(el){ el.remove(); renderToken(tok); }
  }
  closeModal();
  showToast('📷 تم حفظ الصورة');
  saveBfState();
}

  state.gridColor = clr;
  state.gridBorderColor = clr.replace(/[\d.]+\)$/, '0.95)');
  renderGrid();
}

function setGridColorCustom(hex){
  // Convert hex to rgba
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  state.gridColor = `rgba(${r},${g},${b},0.65)`;
  state.gridBorderColor = `rgba(${r},${g},${b},0.95)`;
  renderGrid();
}

function useWhiteMap(){
  // إنشاء canvas أبيض بحجم الشبكة
  const cols = parseInt(document.getElementById('grid-cols-inp')?.value) || state.gridCols;
  const rows = parseInt(document.getElementById('grid-rows-inp')?.value) || state.gridRows;
  const cp   = parseInt(document.getElementById('cell-size-slider')?.value) || state.cellPx;
  const W = cols * cp, H = rows * cp;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f8f8f6';
  ctx.fillRect(0,0,W,H);
  window._pendingMap = { src: canvas.toDataURL('image/png'), w: W, h: H };
  const zone = document.getElementById('map-upload-zone');
  if(zone) zone.innerHTML = `<div class="map-upload-zone-icon">⬜</div><div class="map-upload-zone-text">خريطة بيضاء ${W}×${H}</div>`;
  showToast('⬜ تم تجهيز الخريطة البيضاء — اضغط "تطبيق"');
}

let _mapUploadInput = null;
function triggerMapUpload(){
  _mapUploadInput = document.createElement('input');
  _mapUploadInput.type='file'; _mapUploadInput.accept='image/*';
  _mapUploadInput.onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      // load to get natural dimensions
      const img=new Image();
      img.onload=()=>{
        window._pendingMap = {src:ev.target.result, w:img.naturalWidth, h:img.naturalHeight};
        const zone=document.getElementById('map-upload-zone');
        if(zone) zone.innerHTML=`<div class="map-upload-zone-icon">✅</div><div class="map-upload-zone-text">${f.name} — ${img.naturalWidth}×${img.naturalHeight}</div>`;
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  };
  _mapUploadInput.click();
}

function applyMapSettings(){
  const colsEl = document.getElementById('grid-cols-inp');
  const rowsEl = document.getElementById('grid-rows-inp');
  const slider  = document.getElementById('cell-size-slider');
  const sensEl  = document.getElementById('pan-sens-slider');

  const cols = Math.max(1, parseInt(colsEl?.value)||state.gridCols);
  const rows = Math.max(1, parseInt(rowsEl?.value)||state.gridRows);
  const cp   = parseInt(slider?.value)||state.cellPx;
  const sens = parseFloat(sensEl?.value)||state.panSensitivity||1.0;

  state.gridCols = cols;
  state.gridRows = rows;
  state.cellPx   = cp;
  state.panSensitivity = sens;
  state.mapW = cols * cp;
  state.mapH = rows * cp;

  if(window._pendingMap){
    state.mapSrc  = window._pendingMap.src;
    state.mapNatW = window._pendingMap.w;
    state.mapNatH = window._pendingMap.h;
    window._pendingMap = null;
  }

  closeModal();
  renderAll();
  saveBfState();
}

function removeMap(){
  if(!confirm('هل تريد إزالة الخريطة؟ الشخصيات ستبقى.')) return;
  state.mapSrc=null; state.mapW=0; state.mapH=0;
  closeModal(); renderAll(); saveBfState();
}

/* يُعيد رسم قائمة الشخصيات داخل الـ picker فقط (بدون إعادة بناء المودال كله) — يُستخدم مع البحث الفوري */
function renderNpcPickList(filterText){
  const listEl = document.getElementById('npc-pick-list');
  if(!listEl) return;

  const profiles = getAmazadProfiles();
  const onMap = new Set(state.tokens.map(t=>t.profileId));
  const q = (filterText||'').trim().toLowerCase();
  const filtered = q ? profiles.filter(p=>(p.name||'').toLowerCase().includes(q)) : profiles;

  const countEl = document.getElementById('npc-pick-count');
  if(countEl){
    countEl.textContent = q
      ? `${filtered.length} من ${profiles.length} شخصية`
      : `${profiles.length} شخصية محفوظة`;
  }

  if(!profiles.length){
    listEl.innerHTML = `<div class="npc-pick-empty">لا توجد شخصيات محفوظة بعد<br><span style="font-size:10px;">أضف شخصيات من مولّد أمازاد أولاً</span></div>`;
    return;
  }

  if(!filtered.length){
    listEl.innerHTML = `<div class="npc-pick-empty">لا توجد نتائج مطابقة لـ «${filterText}»</div>`;
    return;
  }

  let html = '';
  filtered.forEach(p=>{
    const pid = p.saveId || p.id;
    const imgSrc = getCharImage(pid);
    const raceColor = RC[p.race]||'#7c3aed';
    const alreadyOn = onMap.has(pid);
    html += `
      <div class="npc-pick-item" onclick="addTokenFromProfile('${pid}')" style="${alreadyOn?'opacity:.55':''}" title="${alreadyOn?'موجود على الخريطة':''}">
        <div class="npc-pick-avatar" style="border-color:${raceColor}">
          ${imgSrc?`<img src="${imgSrc}">`:(p.race?p.race[0]:'?')}
        </div>
        <div class="npc-pick-info">
          <div class="npc-pick-name" style="color:${raceColor}">${p.name||'بدون اسم'} ${alreadyOn?'✓':''}</div>
          <div class="npc-pick-sub">${p.race||''} • Lv.${p.level||1} • ${p.background||''}</div>
        </div>
        <div style="font-size:10px;color:var(--muted);">
          ❤${p.hp||0} ✨${p.hala||0}
        </div>
      </div>
    `;
  });
  listEl.innerHTML = html;
}

function addTokenFromProfile(profileId){
  if(!state.mapSrc){ showToast('⚠ يجب تحميل خريطة أولاً'); return; }
  const profiles = getAmazadProfiles();
  const p = profiles.find(x=>(x.saveId||x.id)===profileId||(x.saveId||x.id)==profileId);
  if(!p){ showToast('⚠ لم يُعثر على الشخصية'); return; }

  const pid = p.saveId || p.id;

  const wrapRect = bfWrap.getBoundingClientRect();
  const cx = (wrapRect.width/2  - state.pan.x) / state.zoom;
  const cy = (wrapRect.height/2 - state.pan.y) / state.zoom;
  const col = Math.round(cx/state.cellPx);
  const row = Math.round(cy/state.cellPx);

  // Read HP/hala/stamina — try combat-mode current values first
  const hpMax    = p.hpMax  || p.hp  || 100;
  const hpCurr   = p.hpCurrent  ?? hpMax;
  const haMax    = p.halaMax || p.hala || 100;
  const haCurr   = p.halaCurrent ?? haMax;
  const stMax    = p.staminaMax || 100;
  const stCurr   = p.staminaCurrent ?? stMax;
  const charSize = p.size || p.height || 100;

  const tok = {
    id:         Date.now()+'_'+Math.random().toString(36).substr(2,5),
    profileId:  String(pid),
    name:       p.name||'بدون اسم',
    race:       p.race||'',
    raceColor:  RC[p.race]||'#7c3aed',
    level:      p.level||1,
    lifeGrade:  p.lifeGrade||'',
    charSize,
    emoji:      raceEmoji(p.race),
    hp:         hpCurr,
    hpMax,
    hala:       haCurr,
    halaMax:    haMax,
    stamina:    stCurr,
    staminaMax: stMax,
    defense:    p.defense    ?? 0,
    immunity:   p.immunity   ?? 0,
    trueDefense:p.trueDefense ?? p.trueDef ?? 0,
    dmgReduce:  p.dmgReduce  ?? 0,
    physStrPct: p.physStrPct ?? 0,
    classes:    p.classes||[],
    // بارات صحة إضافية
    extraBars:  (p.extraHpBars||[]).map(b=>({
      id: b.id||Date.now()+Math.random(),
      label: b.label||'بار إضافي',
      color: b.color||'#f97316',
      current: b.current??b.max??100,
      max: b.max||100,
    })),
    barrierBinding: p.barrierBinding || null,   // كان لا يُنسخ فلا يؤثر ربط الحاجز على الضرر
    x: col * state.cellPx,
    y: row * state.cellPx,
  };
  applyDerivedChances(tok, p, false);

  state.tokens.push(tok);
  closeModal();
  renderToken(tok);
  updateTokenCountDisplay();
  saveBfState();
  showToast(`✓ ${tok.name} أضيفت إلى الخريطة`);
}

function raceEmoji(race){
  const map = {
    "إنسان":"🧑","سكارد":"💜","آلزاداكايند":"🐉","إتشيرما":"👁",
    "سيلافين":"✨","بهائم الظلام":"🌑","وحش الظلام":"🌒",
    "ساروفيان":"🟢","ساروفيان خرافي":"🔵","رؤوس الكلاب":"🐕","حيوان":"🐾",
  };
  return map[race]||'⚔';
}

function removeToken(tokId){

function saveCropForProfile(profileId){
  const cSize = 220;
  const canvas = document.createElement('canvas');
  canvas.width = cSize; canvas.height = cSize;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(cSize/2,cSize/2,cSize/2,0,Math.PI*2);
  ctx.clip();
  const img = document.getElementById('crop-img');
  const w = cropState.srcW * cropState.zoom;
  const h = cropState.srcH * cropState.zoom;
  const x = 110-(w/2)+cropState.x;
  const y = 110-(h/2)+cropState.y;
  ctx.drawImage(img,x,y,w,h);
  const dataUrl = canvas.toDataURL('image/jpeg',0.85);
  saveCharImage(profileId, dataUrl);
  // update tokens that use this profile
  state.tokens.forEach(tok=>{
    if(tok.profileId===profileId){
      tok._imgCache=dataUrl;
      const el=document.getElementById('tok_'+tok.id);
      if(el){el.remove(); renderToken(tok);}
    }
  });
  closeModal();
  showToast('📷 تم حفظ الصورة');
}

function deleteProfileImg(profileId){
  deleteCharImage(profileId);
  closeModal();
  // re-open
  openProfileImageManager();
  // re-render affected tokens
  state.tokens.forEach(tok=>{
    if(tok.profileId===profileId){
      const el=document.getElementById('tok_'+tok.id);
      if(el){el.remove(); renderToken(tok);}
    }
  });
}

/* ═══════════════════════════════════════════════════════
   ATTACK LAUNCHER & DAMAGE CALCULATOR
   ─────────────────────────────────────────────────────
   Attack types:  physical | magical | true
   Defense order:
     1. percentDef  (physStrPct) — half vs physical unless barrier bound to بأس
     2. defense     (flat)
     3. trueDefense (flat, after 1+2)
   Barrier binding bonus:
     degree "ثالثة" → percentDef works fully vs physical
     degree "ثانية" → 25% effectiveness vs true damage
     degree "أولى"  → 50% effectiveness vs true damage
═══════════════════════════════════════════════════════ */

let _dmgPopupZ = 600;
function nextDmgZ(){ return ++_dmgPopupZ; }

  const sw=window.innerWidth, sh=window.innerHeight;

  el.id = 'atk-launcher';

  el.innerHTML = `

    <button class="bp-close" onclick="this.parentElement.remove()">×</button>

    <div class="bp-body">

    <div class="dmg-section">
      <div class="dmg-section-title">المهاجم</div>

        <button class="atk-type-btn" id="atktype-magical" onclick="setAtkType('magical')">سحرية ✨</button>

/* ── DAMAGE FORMULA ──
   extraRes: { label, pct } — مقاومة إضافية يدوية منفصلة عن دفاع الشخصية المحفوظ.
   تُطبَّق بعد كل طبقات الدفاع الأخرى وتتراكم مضاعفةً (لا جمعاً) مع الدفاع المئوي الأساسي:
   الضرر المتبقي النهائي = الضرر المتبقي × (1 − extraRes.pct/100)
   مثال: تنين بدفاع مئوي 90٪ (يتلقى 10٪) + مقاومة نار إضافية 50٪ → يتلقى 10٪ × 50٪ = 5٪ فقط، وليس 0٪. */
function calcDamageForTarget(rawDmg, rawTrueDmg, atkType, tok, extraRes){
  const sd       = getSideDefenses(tok);
  const defense  = sd.defense;    // دفاع + إضافي
  const trueDef  = sd.trueDef;    // دفاع حقيقي + إضافي
  const baseDR   = sd.base;       // دفاع مئوي + إضافي
  const barrier  = getTokBarrier(tok);
  const barrierDeg = cbBarrierDegree(tok);
  const degRank = CB_DEG_RANK[barrierDeg] || 0;   // تراكمي: ثالثة=1، ثانية=2، أولى/صفر≥3
  const trueDefEff = degRank>=3 ? 0.5 : degRank===2 ? 0.25 : 0;   // فعالية الدفاع المئوي ضد الحقيقي
  const extraResPct = Math.max(0, Math.min(100, parseFloat(extraRes?.pct) || 0));
  const extraResLabel = (extraRes?.label || '').trim();

  const steps = [];
  let dmg = parseFloat(rawDmg) || 0;
  let trueDmg = parseFloat(rawTrueDmg) || 0;

  // 1. الدفاع المئوي الأساسي (dmgReduce)
  if(baseDR > 0 && dmg > 0){
    let effectivePct = baseDR;
    if(atkType === 'physical'){
      if(degRank >= 1) effectivePct = baseDR;      // ثالثة فما فوق: كالسحري — الدفاع المئوي كاملاً
      else effectivePct = baseDR / 2;
    } else if(atkType === 'magical'){
      effectivePct = baseDR;
    } else if(atkType === 'true'){
      effectivePct = baseDR * trueDefEff;
    }
    if(effectivePct > 0){
      const reduction = dmg * (effectivePct / 100);
      steps.push({ label:`دفاع مئوي ${fmt1(baseDR)}٪ (فعّال ${fmt1(effectivePct)}٪)`, val: -reduction });
      dmg = Math.max(0, dmg - reduction);
    }
  }

  // 2. الدفاع الجانبي الأول (درجة 4 أو 5) — 50٪ فعالية ضد الضرر المادي
  if(sd.side1 > 0 && dmg > 0 && atkType !== 'true'){
    const effectiveSide1 = atkType === 'physical' ? sd.side1 * 0.5 : sd.side1;
    const reduction = dmg * (effectiveSide1 / 100);
    steps.push({ label:`🛡 دفاع جانبي① ${sd.side1}٪${atkType==='physical'?' (فعّال 50٪)':''}`, val: -reduction });
    dmg = Math.max(0, dmg - reduction);
  }

  // 3. الدفاع الجانبي الثاني — 50٪ فعالية ضد المادي
  if(sd.side2 > 0 && dmg > 0 && atkType !== 'true'){
    const effectiveSide2 = atkType === 'physical' ? sd.side2 * 0.5 : sd.side2;
    const reduction = dmg * (effectiveSide2 / 100);
    const lbl = sd.isGrade5 ? `🛡 دفاع جانبي② ${sd.side2}٪` : `🌿 دفاع جانبي② (طبيعة) ${sd.side2}٪`;
    steps.push({ label: lbl + (atkType==='physical'?' (فعّال 50٪)':''), val: -reduction });
    dmg = Math.max(0, dmg - reduction);
  }

  // 4. الدفاع الجانبي الثالث — 50٪ فعالية ضد المادي
  if(sd.side3 > 0 && dmg > 0 && atkType !== 'true'){
    const effectiveSide3 = atkType === 'physical' ? sd.side3 * 0.5 : sd.side3;
    const reduction = dmg * (effectiveSide3 / 100);
    steps.push({ label:`🌿 دفاع جانبي③ (طبيعة) ${sd.side3}٪${atkType==='physical'?' (فعّال 50٪)':''}`, val: -reduction });
    dmg = Math.max(0, dmg - reduction);
  }

  // 4.5. مقاومة إضافية يدوية — منفصلة عن دفاع الشخصية، تُراكم مضاعفةً على ما تبقى من الضرر
  //      (وليس جمعاً مع الدفاع المئوي الأساسي) — تنطبق على الضرر المادي والسحري، لا على الحقيقي مباشرة
  if(extraResPct > 0 && dmg > 0 && atkType !== 'true'){
    const reduction = dmg * (extraResPct / 100);
    const lbl = extraResLabel ? `🔥 ${extraResLabel} ${extraResPct}٪ (تراكم مضاعف)` : `🔥 مقاومة إضافية ${extraResPct}٪ (تراكم مضاعف)`;
    steps.push({ label: lbl, val: -reduction });
    dmg = Math.max(0, dmg - reduction);
  }

  // 5. الدفاع الثابت العادي
  if(defense > 0 && dmg > 0 && atkType !== 'true'){
    const reduction = Math.min(dmg, defense);
    steps.push({ label:`دفاع عادي ${fmt1(defense)}`, val:-reduction });
    dmg = Math.max(0, dmg - reduction);
  }

  // 6. الدفاع الحقيقي
  if(trueDef > 0 && dmg > 0){
    const reduction = Math.min(dmg, trueDef);
    steps.push({ label:`دفاع حقيقي ${fmt1(trueDef)}`, val:-reduction });
    dmg = Math.max(0, dmg - reduction);
  }

  let finalDmg = dmg;
  let usedTruePath = false;
  if(finalDmg <= 0 && trueDmg > 0){
    usedTruePath = true;
    // ربط الحاجز بالبأس: الدفاع المئوي يعمل ضد الضرر الحقيقي بفعالية 25٪ (درجة ثانية) أو 50٪ (درجة أولى)، وبلا فعالية في الثالثة
    const truePctEff = baseDR * trueDefEff;
    let trueAfterPct = trueDmg;
    if(truePctEff > 0){
      const red = trueDmg * (truePctEff/100);
      trueAfterPct = Math.max(0, trueDmg - red);
      steps.push({ label:`دفاع مئوي ضد الضرر الحقيقي ${fmt1(baseDR)}٪ (فعّال ${fmt1(truePctEff)}٪ — ربط الحاجز بالبأس ${barrierDeg})`, val: -red });
    }
    finalDmg = Math.max(0, trueAfterPct - trueDef);
    steps.push({ label:`اللجوء للضرر الحقيقي: ${fmt1(trueAfterPct)} - ${fmt1(trueDef)}`, val: finalDmg, isTrue:true });
  }

  // قاعدة العشرية: كل قيمة تُقتطع لخانة واحدة، فيتطابق ما يُعرض مع ما يُطبَّق على الصحة
  steps.forEach(s=>{ s.val = trunc1(s.val); });
  finalDmg = trunc1(finalDmg);
  return { finalDmg, steps, usedTruePath };
}

/* ── LAUNCH DAMAGE CALC ── */
function launchDamageCalc(){
  const rawDmg     = parseFloat(document.getElementById('atk-dmg')?.value)||0;
  const rawTrueDmg = parseFloat(document.getElementById('atk-true-dmg')?.value)||0;
  const atkType    = window._atkType || 'physical';
  const targets    = window._atkTargets || new Set();
  const extraResPct   = parseFloat(document.getElementById('atk-extra-res-pct')?.value) || 0;
  const extraResLabel = (document.getElementById('atk-extra-res-label')?.value || '').trim();
  const extraRes = { label: extraResLabel, pct: extraResPct };

  if(targets.size === 0){ showToast('⚠ اختر هدفاً واحداً على الأقل'); return; }

  const results = [];
  targets.forEach(tokId=>{
    const tok = state.tokens.find(t=>t.id===tokId);
    if(!tok) return;
    const r = calcDamageForTarget(rawDmg, rawTrueDmg, atkType, tok, extraRes);
    results.push({ tok, ...r });
  });

  openDamageResultPopup(results, atkType, rawDmg, rawTrueDmg, extraRes);
}

/* ── DAMAGE RESULT POPUP ── */
function openDamageResultPopup(results, atkType, rawDmg, rawTrueDmg, extraRes){
  const el = document.createElement('div');
  el.className = 'dmg-popup';
  el.style.zIndex = nextDmgZ();

  el.style.left = Math.max(8, Math.min(sw-320, 20 + Object.keys(openPopups).length*18)) + 'px';

  const atkTypeLabel = {physical:'جسدية ⚔',magical:'سحرية ✨',true:'حقيقية 💀'}[atkType]||'—';
  const hasExtraRes = extraRes && extraRes.pct > 0;

  let resHTML = results.map(r=>{
    const hpBefore = r.tok.hp;

    const stepsHtml = r.steps.map(s=>`
      <div class="dmg-result-row">

        <span style="color:${s.val<0?'#ef4444':'#22c55e'};font-weight:700;">${s.val>0?'+':''}${fmt1(s.val)}</span>

    return `
      <div class="dmg-result-item">
        <div class="dmg-result-name" style="color:${rc}">${r.tok.name}</div>
        <div class="dmg-result-row"><span>الضرر الأولي</span><span style="color:#f87171;font-weight:700;">−${fmt1(rawDmg)}</span></div>
        ${stepsHtml}
        <div class="dmg-result-final" style="color:${r.finalDmg>0?'#ef4444':'#22c55e'}">
          ${r.finalDmg > 0 ? `💥 ضرر فعلي: −${fmt1(r.finalDmg)}` : '🛡 الضرر محجوب بالكامل'}
          ${r.usedTruePath ? ' <span style="font-size:9px;color:#f59e0b">(ضرر حقيقي)</span>' : ''}
        </div>
        <div style="margin-top:4px;font-size:10px;color:var(--muted)">
          HP: ${fmt1(hpBefore)} → <span style="color:${hpAfter<=0?'#ef4444':'#22c55e'};font-weight:700">${fmt1(hpAfter)}</span>
        </div>
        <div class="dmg-result-bar"><div class="dmg-result-bar-fill" style="width:${hpPct}%;"></div></div>
        <button onclick="applyDamageToToken('${r.tok.id}',${r.finalDmg})"
          style="margin-top:6px;width:100%;padding:5px;background:#ef444422;border:1px solid #ef444455;border-radius:6px;color:#ef4444;font-size:11px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;">
          ✓ تطبيق الضرر على ${r.tok.name}
        </button>
      </div>
    `;
  }).join('');

  const dragId = 'dmg-res-drag-'+Date.now();
  el.innerHTML = `
    <div class="dmg-drag-bar" id="${dragId}"><div class="dmg-drag-handle"></div></div>
    <button class="bp-close" onclick="this.parentElement.remove()">×</button>
    <div class="bp-body">
    <div style="font-size:13px;font-weight:900;color:#ef4444;margin-bottom:10px;">💥 نتائج الضرر</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:10px;">
      نوع: <strong style="color:var(--text)">${atkTypeLabel}</strong> |
      ضرر: <strong style="color:#f87171">${fmt1(rawDmg)}</strong>
      ${rawTrueDmg>0?`| حقيقي: <strong style="color:#fbbf24">${fmt1(rawTrueDmg)}</strong>`:''}
      ${hasExtraRes?`<br>🔥 ${extraRes.label||'مقاومة إضافية'}: <strong style="color:#fb923c">${extraRes.pct}٪</strong> <span style="opacity:.7">(تراكم مضاعف)</span>`:''}
    </div>
    <div>${resHTML}</div>
    <button onclick="applyAllDamage(${JSON.stringify(results.map(r=>({id:r.tok.id,dmg:r.finalDmg})))})"
      style="width:100%;margin-top:8px;padding:9px;background:#ef4444;border:none;border-radius:9px;color:#fff;font-size:12px;font-weight:900;cursor:pointer;font-family:'Cairo',sans-serif;">
      ✓ تطبيق الضرر على الجميع
    </button>
    </div>
  `;
  document.getElementById('dmg-popups-layer').appendChild(el);
  setTimeout(()=> makeDraggableEl(el, document.getElementById(dragId)), 50);
  keepPopupInView(el);

function applyDamageToToken(tokId, dmg){
  const tok = state.tokens.find(t=>t.id===tokId);
  if(!tok) return;
  dmg = trunc1(dmg);
  tok.hp = trunc1(Math.max(0, (tok.hp||0) - dmg));
  const el = document.getElementById('tok_'+tokId);
  if(el){ el.remove(); renderToken(tok); }
  Object.keys(openPopups).forEach(pid=>{
    if(openPopups[pid]) refreshPopupBars(pid);
  });
  saveBfState();
  showToast(`💥 ${tok.name}: −${fmt1(dmg)} HP → ${fmt1(tok.hp)}`);
}

function applyAllDamage(list){
  list.forEach(({id, dmg})=> applyDamageToToken(id, dmg));
}

/* Generic draggable helper */
/* ── تحجيم النوافذ بالسحب من الشريط السفلي ── */
function makeResizableEl(el, handle, badge){
  if(!handle) return;
  let resizing = false;
  let startX   = 0;
  let startW   = 0;

  handle.addEventListener('mousedown', e=>{
    resizing = true;
    startX   = e.clientX;
    startW   = el.offsetWidth;
    e.stopPropagation();
    e.preventDefault();
    document.body.style.cursor = 'ew-resize';
  });
  handle.addEventListener('touchstart', e=>{
    resizing = true;
    startX   = e.touches[0].clientX;
    startW   = el.offsetWidth;
    e.stopPropagation();
  }, {passive:true});

  window.addEventListener('mousemove', e=>{
    if(!resizing) return;
    const dx  = e.clientX - startX;
    const newW = Math.max(180, Math.min(420, startW + dx));
    el.style.width = newW + 'px';
    if(badge) badge.textContent = newW + 'px';
  });
  window.addEventListener('touchmove', e=>{
    if(!resizing) return;
    const dx  = e.touches[0].clientX - startX;
    const newW = Math.max(180, Math.min(420, startW + dx));
    el.style.width = newW + 'px';
    if(badge) badge.textContent = newW + 'px';
  }, {passive:true});

  const stop = ()=>{ resizing=false; document.body.style.cursor=''; };
  window.addEventListener('mouseup',  stop);
  window.addEventListener('touchend', stop);
}

/* يُبقي النافذة كلها داخل الشاشة (عند الفتح، وعند تغيّر حجمها أو حجم الشاشة) */
function clampPopupIntoView(el){
  if(!el.isConnected) return;
  const m = 8, vw = window.innerWidth, vh = window.innerHeight;
  const w = el.offsetWidth, h = el.offsetHeight;
  const left = Math.max(m, Math.min(parseFloat(el.style.left)||0, vw - w - m));
  const top  = Math.max(m, Math.min(parseFloat(el.style.top)||0,  vh - h - m));
  el.style.left = left + 'px';
  el.style.top  = top  + 'px';
}
function keepPopupInView(el){
  clampPopupIntoView(el);
  if(window.ResizeObserver){ new ResizeObserver(()=>clampPopupIntoView(el)).observe(el); }
}
window.addEventListener('resize', ()=>{
  document.querySelectorAll('.battle-popup, .dmg-popup').forEach(clampPopupIntoView);
});

function makeDraggableEl(el, handle){
  if(!handle) return;
  let sx,sy,sl,st,drag=false;
  const dn=e=>{
    drag=true; el.style.zIndex=nextDmgZ();
    const ev=e.touches?e.touches[0]:e;
    sx=ev.clientX;sy=ev.clientY;
    sl=parseInt(el.style.left)||0;st=parseInt(el.style.top)||0;
    e.preventDefault();
  };
  const dm=e=>{
    if(!drag)return;
    const ev=e.touches?e.touches[0]:e;
    const maxL=Math.max(0,window.innerWidth-el.offsetWidth), maxT=Math.max(0,window.innerHeight-el.offsetHeight);
    el.style.left=Math.max(0,Math.min(maxL,sl+(ev.clientX-sx)))+'px';
    el.style.top =Math.max(0,Math.min(maxT,st+(ev.clientY-sy)))+'px';
    e.preventDefault();
  };
  const du=()=>{drag=false;};
  handle.addEventListener('mousedown',dn);
  handle.addEventListener('touchstart',dn,{passive:false});
  window.addEventListener('mousemove',dm);
  window.addEventListener('touchmove',dm,{passive:false});
  window.addEventListener('mouseup',du);
  window.addEventListener('touchend',du);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeAllPopups(); closeModal(); }
  if(!selectedTokenId) return;
  const step = 1;
  if(e.key==='ArrowUp')    { e.preventDefault(); moveToken(selectedTokenId, 0, -step); }
  if(e.key==='ArrowDown')  { e.preventDefault(); moveToken(selectedTokenId, 0,  step); }
  if(e.key==='ArrowLeft')  { e.preventDefault(); moveToken(selectedTokenId,  step, 0); }
  if(e.key==='ArrowRight') { e.preventDefault(); moveToken(selectedTokenId, -step, 0); }
  if(e.key==='Delete'||e.key==='Backspace'){ removeToken(selectedTokenId); }
});

/* ── خريطة بيضاء سريعة ── */
function quickWhiteMap(){
  const cols = state.gridCols || 20;
  const rows = state.gridRows || 20;
  const cp   = state.cellPx || 60;
  const W = cols * cp, H = rows * cp;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f8f8f6';
  ctx.fillRect(0,0,W,H);
  state.mapSrc  = canvas.toDataURL('image/png');
  state.mapNatW = W; state.mapNatH = H;
  state.mapW    = W; state.mapH    = H;
  renderAll();
  saveBfState();
  showToast('⬜ تم إنشاء خريطة بيضاء');
}
