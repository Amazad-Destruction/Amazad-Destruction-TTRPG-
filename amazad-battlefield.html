<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أرض المعركة — أمازاد</title>
  <meta name="theme-color" content="#060810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أرض المعركة">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;900&display=swap');

    :root {
      --bg:       #060810;
      --bg2:      #0a0e1a;
      --bg3:      #0e1220;
      --border:   #1a2035;
      --border2:  #232840;
      --accent:   #7c3aed;
      --accent2:  #a855f7;
      --red:      #ef4444;
      --gold:     #f59e0b;
      --blue:     #3b82f6;
      --green:    #22c55e;
      --text:     #e2e8f0;
      --muted:    #6b7280;
      --muted2:   #374151;
      --grid-clr: rgba(200,30,30,0.55);
      --grid-clr2:rgba(180,10,10,0.25);
    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Cairo',sans-serif;direction:rtl;}
    #app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}

    /* ═══ HEADER ═══ */
    .header{
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;
      padding:8px 14px;background:var(--bg2);
      border-bottom:1px solid var(--border);
      min-height:52px;z-index:100;flex-shrink:0;
    }
    .header-title{font-size:15px;font-weight:900;color:var(--accent2);letter-spacing:.05em;}
    .header-sub{font-size:10px;color:var(--muted);margin-top:1px;max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .header-btn{
      display:flex;align-items:center;gap:6px;padding:7px 14px;
      background:var(--bg3);border:1px solid var(--border2);border-radius:10px;
      color:var(--text);font-size:12px;font-weight:700;cursor:pointer;
      font-family:'Cairo',sans-serif;white-space:nowrap;transition:border-color .2s,background .2s;
    }
    .header-btn:hover{border-color:var(--accent);background:#12172a;}
    .header-btn.danger{border-color:#ef444455;color:#ef4444;}
    .header-btn.danger:hover{border-color:#ef4444;background:#1a0808;}

    /* ═══ TOOLBAR ═══ */
    .toolbar{
      display:flex;align-items:center;gap:8px;padding:8px 14px;
      background:var(--bg2);border-bottom:1px solid var(--border);
      overflow-x:auto;flex-shrink:0;
    }
    .toolbar::-webkit-scrollbar{height:0;}
    .tool-btn{
      display:flex;align-items:center;gap:5px;padding:6px 12px;
      background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
      color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;
      font-family:'Cairo',sans-serif;white-space:nowrap;transition:all .2s;flex-shrink:0;
    }
    .tool-btn:hover{border-color:var(--accent);color:var(--text);}
    .tool-btn.active{border-color:var(--accent);color:var(--accent2);background:#12102a;}
    .tool-divider{width:1px;height:24px;background:var(--border2);flex-shrink:0;}

    /* ═══ BATTLEFIELD WRAPPER ═══ */
    #bf-wrap{
      flex:1;overflow:hidden;position:relative;background:var(--bg);
      cursor:grab;
      -webkit-user-select:none;user-select:none;
    }
    #bf-wrap.panning{cursor:grabbing;}

    /* ═══ CANVAS AREA ═══ */
    #bf-canvas{
      position:absolute;top:0;left:0;
      transform-origin:0 0;
      will-change:transform;
    }

    /* MAP IMAGE + GRID OVERLAY */
    #grid-svg{
      position:absolute;top:0;left:0;
      pointer-events:none;
      overflow:visible;
      z-index:5;
      display:block;
    }
    #map-img{
      position:absolute;top:0;left:0;
      z-index:1;
      display:block;
      image-rendering:crisp-edges;
    }
    /* الشبكة الثابتة المستقلة — تعمل دائماً بمعزل عن الخريطة */
    #grid-canvas-overlay{
      position:absolute;top:0;left:0;
      pointer-events:none;
      z-index:6;
      image-rendering:crisp-edges;
    }

    /* ═══ TOKENS ═══ */
    /* الحاوية .token نقطة بلا حجم وبلا stacking context، فتشترك الأفاتار والبارات والأسماء في طبقة الخريطة نفسها:
       الأفاتار 10 < البارات 11 < الأسماء 12 → الاسم فوق أي بار دائماً (حتى بارات الشخصيات الأخرى) */
    .token{
      position:absolute;width:0;height:0;
      cursor:pointer;
      -webkit-user-select:none;user-select:none;
    }
    .token:hover .token-avatar{filter:drop-shadow(0 0 8px var(--accent));}
    .token.selected .token-avatar{filter:drop-shadow(0 0 10px #a855f7) drop-shadow(0 0 18px #7c3aed88);}

    .token-avatar{
      position:absolute;z-index:10;
      border-radius:50%;border:2px solid #7c3aed;
      object-fit:cover;background:#1a2035;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;overflow:hidden;flex-shrink:0;
      box-shadow:0 2px 12px #00000088;
    }
    .token-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .token-avatar.no-img{font-size:inherit;}

    .token-bars{
      position:absolute;left:0;z-index:11;width:max-content;
      display:flex;flex-direction:column;gap:1px;
      background:#00000099;border-radius:4px;padding:2px 4px;
      backdrop-filter:blur(4px);
    }
    .token-bar-row{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:700;font-family:'Cairo',sans-serif;}
    /* البار بسماكة النص الرقمي المجاور له (كان 4px فيختفي)، والنسبة بنفس سماكة القيمة */
    .token-bar-track{width:44px;height:9px;background:#1a2035;border-radius:3px;overflow:hidden;flex-shrink:0;}
    .token-bar-fill{height:100%;border-radius:3px;transition:width .3s;}
    .token-bar-val{font-size:8px;font-weight:800;white-space:nowrap;direction:ltr;}
    .token-bar-pct{font-weight:800;opacity:1;}
    #bf-canvas.bars-hidden .token-bars{display:none;}

    .token-name{
      position:absolute;left:0;z-index:12;width:max-content;
      font-size:9px;font-weight:700;color:var(--text);
      background:#00000099;border-radius:3px;padding:1px 5px;
      white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis;
      text-align:center;backdrop-filter:blur(4px);
    }

    /* ═══ EMPTY STATE ═══ */
    #empty-bf{
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;
      pointer-events:none;
    }
    .empty-icon{font-size:64px;opacity:.15;}
    .empty-text{font-size:13px;color:var(--muted);font-weight:600;text-align:center;opacity:.6;}

    /* ═══ MODALS ═══ */
    .modal-bg{
      position:fixed;inset:0;background:#00000099;backdrop-filter:blur(4px);
      display:flex;align-items:flex-end;justify-content:center;
      z-index:1000;animation:fadeIn .2s ease;
    }
    .modal-bg.center{align-items:center;}
    .modal{
      background:var(--bg2);border:1px solid var(--border2);
      border-radius:20px 20px 0 0;width:100%;max-width:480px;
      max-height:90vh;overflow-y:auto;padding:20px 16px 32px;
      animation:slideUp .25s cubic-bezier(.22,1,.36,1);
    }
    .modal.center{border-radius:16px;margin:16px;}
    .modal::-webkit-scrollbar{width:0;}
    .modal-title{font-size:16px;font-weight:900;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
    .modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;display:block;}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}

    /* ═══ FORM ELEMENTS ═══ */
    .form-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;letter-spacing:.05em;}
    .form-group{margin-bottom:14px;}
    .form-input{
      width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;
      color:var(--text);font-size:13px;padding:10px 12px;outline:none;
      font-family:'Cairo',sans-serif;direction:rtl;transition:border-color .2s;
    }
    .form-input:focus{border-color:var(--accent);}
    .form-row{display:flex;gap:8px;}
    .form-row .form-group{flex:1;}

    /* ═══ BUTTONS ═══ */
    .btn{
      padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;
      cursor:pointer;font-family:'Cairo',sans-serif;border:none;transition:all .2s;
    }
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:#6d28d9;}
    .btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);}
    .btn-ghost:hover{border-color:var(--border);color:var(--text);}
    .btn-red{background:#ef444422;border:1px solid #ef444455;color:#ef4444;}
    .btn-red:hover{background:#ef444433;}
    .btn-row{display:flex;gap:8px;margin-top:16px;}

    /* ═══ NPC PICKER ═══ */
    .npc-pick-search{
      width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;
      color:var(--text);font-size:13px;padding:9px 12px;outline:none;margin-bottom:10px;
      font-family:'Cairo',sans-serif;direction:rtl;transition:border-color .2s;
    }
    .npc-pick-search:focus{border-color:var(--accent);}
    .npc-pick-empty{text-align:center;color:var(--muted);font-size:12px;padding:16px 0;}
    .npc-pick-item{
      display:flex;align-items:center;gap:10px;
      padding:10px 12px;background:var(--bg3);border:1px solid var(--border);
      border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .2s;
    }
    .npc-pick-item:hover{border-color:var(--accent);}
    .npc-pick-avatar{
      width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border2);
      background:var(--bg2);display:flex;align-items:center;justify-content:center;
      font-size:16px;overflow:hidden;flex-shrink:0;
    }
    .npc-pick-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .npc-pick-info{}
    .npc-pick-name{font-size:13px;font-weight:700;color:var(--text);}
    .npc-pick-sub{font-size:10px;color:var(--muted);}

    /* ═══ BATTLE POPUP (multi, draggable) ═══ */
    .battle-popup{
      position:fixed;z-index:500;
      background:var(--bg2);border:1px solid var(--border2);border-radius:16px;
      padding:14px;width:270px;min-width:180px;max-width:420px;
      box-shadow:0 8px 32px #000000cc;
      animation:fadeIn .15s ease;
      touch-action:none;
      display:flex;flex-direction:column;
      max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);
      overflow:hidden;
    }
    /* جسم النافذة: يتمرّر داخلياً بينما يبقى شريط السحب والإغلاق ثابتين */
    .bp-body{
      flex:1 1 auto;min-height:0;
      overflow-y:auto;overflow-x:hidden;
      touch-action:pan-y;overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
    }
    .bp-body::-webkit-scrollbar{width:4px;}
    /* شريط التحجيم الأفقي — في أسفل النافذة */
    .bp-resize-bar{
      position:absolute;top:0;left:0;right:0;
      height:10px;cursor:ew-resize;
      display:flex;align-items:center;justify-content:center;
      background:transparent;
      border-radius:16px 16px 0 0;
      z-index:10;
    }
    .bp-resize-bar::after{
      content:'';width:40px;height:3px;
      background:var(--border2);border-radius:2px;
      opacity:0.6;transition:opacity 0.2s;
    }
    .bp-resize-bar:hover::after{ opacity:1; background:var(--accent); }
    /* مؤشر العرض الحالي */
    .bp-size-badge{
      position:absolute;bottom:14px;left:14px;
      font-size:8px;color:var(--muted2);opacity:0;
      transition:opacity 0.3s;pointer-events:none;
    }
    .battle-popup:hover .bp-size-badge{ opacity:1; }
    .bp-drag-bar{
      flex-shrink:0;
      cursor:grab;height:22px;display:flex;align-items:center;justify-content:center;
      margin:-4px -4px 8px;border-radius:12px 12px 0 0;background:#ffffff08;
    }
    .bp-drag-bar:active{cursor:grabbing;}
    .bp-drag-handle{width:34px;height:4px;background:var(--border2);border-radius:2px;}
    .bp-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
    .bp-avatar{
      width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);
      overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;
      font-size:20px;flex-shrink:0;
    }
    .bp-avatar img{width:100%;height:100%;object-fit:cover;}
    .bp-name{font-size:14px;font-weight:900;color:var(--text);}
    .bp-sub{font-size:10px;color:var(--muted);}
    .bp-stat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .bp-stat-label{font-size:10px;color:var(--muted);width:40px;font-weight:700;}
    .bp-bar-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;cursor:pointer;}
    .bp-bar{height:100%;border-radius:4px;transition:width .3s;}
    .bp-val{font-size:11px;color:var(--text);font-weight:700;min-width:92px;text-align:left;white-space:nowrap;direction:ltr;}
    .bp-pct{font-size:9px;color:var(--muted);font-weight:700;margin-left:3px;}
    .bp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
    .bp-action-btn{
      padding:5px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;
      color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;
      font-family:'Cairo',sans-serif;transition:all .15s;
    }
    .bp-action-btn:hover{border-color:var(--accent);color:var(--accent2);}
    .bp-close{
      position:absolute;top:10px;left:10px;background:transparent;border:none;
      color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0 4px;
    }
    .bp-close:hover{color:var(--red);}

    /* Techniques panel inside popup */
    .bp-tech-list{
      max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;
      margin-top:6px;
    }
    .bp-tech-item{
      background:var(--bg3);border:1px solid var(--border);border-radius:8px;
      padding:7px 10px;cursor:pointer;transition:border-color .15s;
    }
    .bp-tech-item:hover{border-color:var(--accent);}
    .bp-tech-name{font-size:11px;font-weight:700;color:var(--text);}
    .bp-tech-sub{font-size:9px;color:var(--muted);margin-top:2px;}
    .bp-tech-desc{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5;display:none;}
    .bp-tech-item.open .bp-tech-desc{display:block;}

    /* profile link btn */
    .bp-profile-link{
      display:flex;align-items:center;justify-content:center;gap:6px;
      width:100%;padding:7px;background:transparent;
      border:1px solid var(--border2);border-radius:8px;
      color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;
      font-family:'Cairo',sans-serif;margin-top:8px;transition:all .15s;
      text-decoration:none;
    }
    .bp-profile-link:hover{border-color:var(--accent2);color:var(--accent2);background:var(--accent2)11;}

    /* ═══ MAP SETUP ═══ */
    .map-upload-zone{
      border:2px dashed var(--border2);border-radius:12px;padding:24px;
      text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:14px;
      background:var(--bg3);
    }
    .map-upload-zone:hover,.map-upload-zone.drag{border-color:var(--accent);}
    .map-upload-zone-icon{font-size:32px;margin-bottom:8px;}
    .map-upload-zone-text{font-size:12px;color:var(--muted);}

    /* ═══ GRID SIZE CONTROLS ═══ */
    .grid-control{
      display:flex;align-items:center;gap:8px;background:var(--bg3);
      border:1px solid var(--border2);border-radius:10px;padding:8px 12px;
      margin-bottom:10px;
    }
    .grid-control label{font-size:11px;color:var(--muted);font-weight:700;flex:1;}
    .grid-control input[type=range]{
      flex:2;-webkit-appearance:none;height:4px;border-radius:2px;
      background:var(--border2);outline:none;cursor:pointer;
    }
    .grid-control input[type=range]::-webkit-slider-thumb{
      -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
      background:var(--accent);cursor:pointer;
    }
    .grid-control .val{font-size:12px;color:var(--text);font-weight:700;min-width:40px;text-align:center;}

    /* ═══ STAT EDIT POPUP ═══ */
    .se-row{
      display:flex;align-items:center;gap:8px;margin-bottom:8px;
    }
    .se-label{font-size:11px;color:var(--muted);width:55px;font-weight:700;}
    .se-input-wrap{display:flex;align-items:center;gap:4px;flex:1;}
    .se-btn{
      width:28px;height:28px;background:var(--bg3);border:1px solid var(--border2);
      border-radius:6px;color:var(--text);font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;
    }
    .se-btn:hover{border-color:var(--accent);}
    .se-val{
      flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--text);
      background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
      padding:4px 0;
    }
    .se-max{font-size:10px;color:var(--muted);}

    /* ═══ ZOOM CONTROLS ═══ */
    .zoom-controls{
      position:absolute;bottom:20px;left:14px;
      display:flex;flex-direction:column;gap:6px;z-index:50;
    }
    .zoom-btn{
      width:36px;height:36px;background:var(--bg2);border:1px solid var(--border2);
      border-radius:9px;color:var(--text);font-size:16px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-weight:700;
      backdrop-filter:blur(8px);transition:border-color .15s;
    }
    .zoom-btn:hover{border-color:var(--accent);}
    /* خيارات إحصائيات الشخصيات */
    .bars-panel{
      /* ثابتة ومتوسطة الشاشة كي لا تخرج عن الحواف مهما كان موضع زر الإحصائيات */
      position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:9000;
      min-width:170px;max-width:calc(100vw - 24px);box-sizing:border-box;
      background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;
      display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(8px);box-shadow:0 4px 18px #0009;
    }
    .bars-panel[hidden]{display:none;}
    .bars-panel-title{font-size:10px;font-weight:800;color:var(--muted);}
    .bars-panel-row{display:flex;align-items:center;gap:6px;}
    .bars-panel-row button,.bars-panel-toggle{
      background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);
      font-family:'Cairo',sans-serif;font-weight:800;cursor:pointer;
    }
    .bars-panel-row button{width:28px;height:28px;font-size:14px;}
    .bars-panel-row .bars-scale-val{flex:1;text-align:center;font-size:12px;font-weight:800;color:var(--text);direction:ltr;}
    .bars-panel-toggle{padding:6px 8px;font-size:11px;}
    .bars-panel-toggle.on{border-color:#ef4444;color:#ff8080;background:#ef444418;}
    .bars-panel.disabled .bars-panel-row{opacity:.4;pointer-events:none;}

    /* ═══ IMAGE UPLOAD IN PROFILE ═══ */
    .img-upload-circle{
      width:80px;height:80px;border-radius:50%;border:2px dashed var(--border2);
      background:var(--bg3);display:flex;align-items:center;justify-content:center;
      cursor:pointer;margin:0 auto 12px;overflow:hidden;transition:border-color .2s;
      font-size:28px;
    }
    .img-upload-circle:hover{border-color:var(--accent);}
    .img-upload-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

    /* ═══ TOAST ═══ */
    .toast{
      position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      background:#1a2035;border:1px solid var(--border2);border-radius:10px;
      padding:8px 18px;font-size:12px;color:var(--text);font-weight:700;
      z-index:2000;animation:fadeIn .2s ease;
      backdrop-filter:blur(8px);white-space:nowrap;
    }

    /* ═══ COORD DISPLAY ═══ */
    .coord-display{
      position:absolute;bottom:20px;right:14px;
      background:#00000088;border:1px solid var(--border2);border-radius:8px;
      padding:4px 10px;font-size:10px;color:var(--muted);
      backdrop-filter:blur(8px);z-index:50;font-family:monospace;
    }

    /* ═══ SCROLLBAR ═══ */
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:var(--bg2);}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

    /* ═══ SECTION DIVIDER ═══ */
    .sec-div{height:1px;background:var(--border);margin:12px 0;}

    /* ═══ IMAGE CROP OVERLAY ═══ */
    .crop-modal-inner{display:flex;flex-direction:column;align-items:center;gap:12px;}
    .crop-canvas-wrap{
      position:relative;width:220px;height:220px;border-radius:50%;overflow:hidden;
      border:2px solid var(--accent);cursor:move;flex-shrink:0;background:#000;
    }
    .crop-img{position:absolute;transform-origin:center center;}
    .crop-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

    /* ═══ ATTACK RANGE OVERLAY ═══ */
    .atk-range-circle{
      position:absolute;
      border-radius:50%;
      pointer-events:none;
      z-index:8;
      transform:translate(-50%,-50%);
      border:2px dashed rgba(255,80,80,0.85);
      background:rgba(255,30,30,0.08);
      box-shadow:0 0 12px rgba(255,50,50,0.4), inset 0 0 12px rgba(255,50,50,0.08);
      animation:atkPulse 1.6s ease-in-out infinite;
    }
    @keyframes atkPulse{
      0%,100%{box-shadow:0 0 12px rgba(255,50,50,0.4),inset 0 0 12px rgba(255,50,50,0.08);}
      50%{box-shadow:0 0 24px rgba(255,80,80,0.7),inset 0 0 20px rgba(255,50,50,0.15);}
    }
    .atk-range-label{
      position:absolute;
      transform:translate(-50%,-50%);
      background:rgba(20,5,5,0.88);border:1px solid rgba(255,80,80,0.6);
      border-radius:6px;padding:2px 8px;font-size:9px;font-weight:700;
      color:#ff8080;z-index:9;pointer-events:none;white-space:nowrap;
    }
    .atk-target-indicator{
      position:absolute;pointer-events:none;z-index:11;
      transform:translate(-50%,-50%);
      width:20px;height:20px;border-radius:50%;
      border:2.5px solid #ff4444;
      animation:targetBlink .5s ease-in-out infinite alternate;
    }
    @keyframes targetBlink{from{opacity:1;transform:translate(-50%,-50%) scale(1);}to{opacity:.5;transform:translate(-50%,-50%) scale(1.18);}}

    /* ═══ DAMAGE CALCULATOR POPUP ═══ */
    .dmg-popup{
      position:fixed;z-index:600;
      background:var(--bg2);border:1px solid #ef444455;border-radius:16px;
      padding:14px;width:310px;
      box-shadow:0 8px 32px #000000cc, 0 0 0 1px #ef444422;
      animation:fadeIn .15s ease;
      font-family:'Cairo',sans-serif;
      direction:rtl;
      display:flex;flex-direction:column;
      max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);
      overflow:hidden;
    }
    .dmg-drag-bar{
      flex-shrink:0;
      cursor:grab;height:20px;display:flex;align-items:center;justify-content:center;
      margin:-4px -4px 10px;border-radius:12px 12px 0 0;background:#ef444411;
    }
    .dmg-drag-handle{width:34px;height:4px;background:#ef444444;border-radius:2px;}
    .dmg-section{margin-bottom:10px;}
    .dmg-section-title{font-size:10px;font-weight:900;color:#ef4444;margin-bottom:6px;
      letter-spacing:.05em;text-transform:uppercase;}
    .dmg-input-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
    .dmg-label{font-size:10px;color:var(--muted);width:90px;flex-shrink:0;text-align:right;}
    .dmg-input{
      flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;
      color:var(--text);font-size:12px;padding:5px 8px;font-family:'Cairo',sans-serif;
      outline:none;direction:ltr;text-align:center;
    }
    .dmg-input:focus{border-color:#ef4444;}
    .dmg-checkbox-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;cursor:pointer;}
    .dmg-checkbox-row input{accent-color:#ef4444;width:14px;height:14px;}
    .dmg-checkbox-row span{font-size:11px;color:var(--muted);}
    .target-chip{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 8px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;
      font-size:10px;font-weight:700;cursor:pointer;margin:2px;
      transition:border-color .15s,background .15s;
    }
    .target-chip{color:#fff;}   /* الاسم أبيض: كان يرث الأسود فلا يُرى على الخلفية الداكنة */
    .target-chip.selected{border-color:#ef4444;background:#ef444422;color:#fff;}
    .target-chip .chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .dmg-result-item{
      background:var(--bg3);border:1px solid var(--border);border-radius:8px;
      padding:8px 10px;margin-bottom:6px;
    }
    .dmg-result-name{font-size:11px;font-weight:700;margin-bottom:4px;}
    .dmg-result-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:2px;}
    .dmg-result-final{font-size:14px;font-weight:900;margin-top:4px;}
    .dmg-result-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px;}
    .dmg-result-bar-fill{height:100%;background:#ef4444;border-radius:3px;transition:width .4s;}
    .atk-type-btn{
      flex:1;padding:5px 6px;background:var(--bg3);border:1px solid var(--border2);
      border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;
      font-family:'Cairo',sans-serif;color:var(--muted);transition:all .15s;text-align:center;
    }
    .atk-type-btn.active{border-color:#ef4444;color:#ff8080;background:#ef444418;}

    /* ═══ المبادرة وترتيب الأدوار ═══ */
    .combat-panel{position:fixed;left:0;right:0;bottom:0;z-index:150;max-height:64vh;max-height:64dvh;overflow-y:auto;
      background:var(--bg2);border-top:2px solid #22c55e66;padding:8px 10px 14px;direction:rtl;box-shadow:0 -6px 24px #000a;
      -webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
    .combat-panel[hidden]{display:none;}
    .token.turn-active .token-avatar{box-shadow:0 0 0 3px #22c55e,0 0 18px 4px #22c55e99;}
    .cb-sec{margin:8px 0;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;}
    .cb-title{font-size:11px;font-weight:900;color:var(--text);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
    .cb-sub{font-size:9px;color:var(--muted);font-weight:700;}
    .cb-btns{display:flex;flex-wrap:wrap;gap:5px;}
    .cb-btn{padding:5px 9px;background:var(--bg2);border:1px solid var(--border2);border-radius:7px;color:var(--text);
      font-size:10px;font-weight:800;font-family:'Cairo',sans-serif;cursor:pointer;}
    .cb-btn.red{border-color:#ef4444;color:#ff8080;background:#ef444418;}
    .cb-btn.green{border-color:#22c55e;color:#4ade80;background:#22c55e18;}
    .cb-btn.gold{border-color:#f59e0b;color:#fbbf24;background:#f59e0b18;}
    .cb-btn.sm{padding:2px 7px;font-size:9px;}
    .cb-sel,.cb-num{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;color:var(--text);
      font-family:'Cairo',sans-serif;font-size:10px;padding:3px 5px;}
    .cb-num{width:52px;text-align:center;direction:ltr;}
    .cb-turn{display:flex;align-items:center;gap:6px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;
      margin-bottom:4px;background:var(--bg2);font-size:11px;}
    .cb-turn.current{border-color:#22c55e;background:#22c55e18;box-shadow:0 0 0 1px #22c55e66;}
    .cb-turn.played{opacity:.45;}
    .cb-turn .nm{flex:1;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .cb-turn .val{font-weight:900;color:#fbbf24;min-width:30px;text-align:center;direction:ltr;}
    .cb-badge{font-size:8px;font-weight:800;padding:1px 5px;border-radius:9px;background:var(--bg3);color:var(--muted);border:1px solid var(--border2);white-space:nowrap;}
    .cb-badge.extra{color:#38bdf8;border-color:#38bdf855;}
    .cb-badge.nat{color:#fbbf24;border-color:#fbbf2466;}
    .cb-badge.bad{color:#f87171;border-color:#f8717166;}
    .cb-badge.int{color:#c084fc;border-color:#c084fc66;}
    .cb-part{padding:7px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg2);}
    .cb-part-head{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
    .cb-part-head .nm{flex:1;font-weight:900;color:#fff;font-size:11px;}
    .cb-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:4px;font-size:9px;color:var(--muted);}
    .cb-chip{padding:2px 7px;border:1px solid var(--border2);border-radius:12px;font-size:9px;font-weight:700;color:var(--muted);cursor:pointer;background:var(--bg3);}
    .cb-chip.on{border-color:#22c55e;color:#4ade80;background:#22c55e18;}
    .cb-log{font-size:9px;color:var(--muted);line-height:1.7;max-height:70px;overflow-y:auto;}
    .chance-box{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--bg3);border-radius:8px;margin-bottom:4px;}
    .chance-box .lb{flex:1;font-size:10px;font-weight:800;color:var(--text);}
    .chance-box .ct{min-width:42px;text-align:center;font-size:13px;font-weight:900;direction:ltr;}
    .chance-box button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-weight:900;cursor:pointer;}

    /* ═══ SESSIONS ═══ */
    .sess-item{
      display:flex;align-items:center;gap:8px;padding:10px 12px;
      background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;
    }
    .sess-item.active{border-color:var(--accent);background:#12102a;}
    .sess-main{flex:1;min-width:0;cursor:pointer;}
    .sess-name{font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .sess-item.active .sess-name{color:var(--accent2);}
    .sess-sub{font-size:10px;color:var(--muted);margin-top:2px;}
    .sess-actions{display:flex;gap:4px;flex-shrink:0;}
    .sess-actions button{
      width:28px;height:28px;background:var(--bg2);border:1px solid var(--border2);border-radius:7px;
      color:var(--muted);font-size:12px;cursor:pointer;
    }
    .sess-actions button:hover{border-color:var(--accent);color:var(--text);}
    .sess-actions button.danger:hover{border-color:#ef4444;color:#ef4444;}

    /* ═══ CONNECTED CHARS LIST ═══ */
    .connected-token{
      display:flex;align-items:center;gap:8px;padding:8px 10px;
      background:var(--bg3);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;
    }
    .connected-token-avatar{
      width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border2);
      overflow:hidden;background:var(--bg2);flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:13px;
    }
    .connected-token-avatar img{width:100%;height:100%;object-fit:cover;}
    .connected-token-name{flex:1;font-size:12px;font-weight:700;color:var(--text);}
    .connected-token-pos{font-size:10px;color:var(--muted);font-family:monospace;}
    .remove-token-btn{
      background:transparent;border:1px solid #ef444433;border-radius:6px;
      color:#ef444488;font-size:11px;padding:2px 6px;cursor:pointer;
    }
    .remove-token-btn:hover{border-color:#ef4444;color:#ef4444;}
    @media (max-width:480px){
      .header-btn{padding:6px 9px;font-size:11px;gap:4px;}
    }
  </style>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <div class="header">

      <button onclick="quickWhiteMap()" style="padding:8px 20px;background:#f8fafc11;border:1px solid #e2e8f033;border-radius:10px;color:#e2e8f0;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;pointer-events:auto;margin-top:12px;">
        ⬜ خريطة بيضاء سريعة (20×20)

        <button title="تصغير" onclick="changeBarScale(-0.1)">−</button>
        <span class="bars-scale-val" id="bars-scale-val">100%</span>

<!-- BATTLE POPUPS CONTAINER (multiple draggable) -->

<script>
/* ══════════════════════════════════════════════════════════
   AMAZAD BATTLEFIELD v2.0
   Companion to amazad.html — reads savedProfiles + images
══════════════════════════════════════════════════════════ */

/* ═══ SUPABASE CONFIG ═══ */
const SUPABASE_URL = "https://ewcsadahyyekvutgdnup.supabase.co";
const SUPABASE_KEY = "sb_publishable_NHfl_osWeI-b_YKd1L_rpA_inHCksfO";
const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ═══ STORAGE KEYS ═══ */
const IMG_KEY_PREFIX    = "amazad_img_";
const BF_KEY            = "amazad_bf_v2";
// المفتاح الحقيقي الذي يستعمله مولّد أمازاد لحفظ الشخصيات "محلياً فقط"
const LOCAL_ONLY_KEY     = "amazad_local_profiles";

/* تحويل صف Supabase → كائن NPC داخلي */
const rowToNpc = (row) => ({
  saveId:       row.id,
  name:         row.name,
  title:        row.title,
  race:         row.race,
  level:        row.level,
  lifeGrade:    row.life_grade,
  hp:           row.hp,
  hpMax:        row.hp_max,
  hala:         row.hala,
  halaMax:      row.hala_max,
  stamina:      row.stamina,
  staminaMax:   row.stamina_max,
  defense:      row.defense      ?? 0,   // دفاع عادي (flat)
  dmgReduce:    row.dmg_reduce   ?? 0,   // تقليل الضرر المئوي
  trueDefense:  row.true_defense ?? 0,   // دفاع حقيقي
  trueDef:      row.true_defense ?? 0,   // نفسه — للتوافق
  physStrPct:   row.phys_str_pct ?? 0,   // معادلة القوة
  immunity:     row.immunity     ?? 0,
  charSize:     row.char_size    ?? 170,
  size:         row.char_size    ?? 170,
  background:   row.background,
  emoji:        row.emoji,
  raceColor:    row.race_color,
  worthiness:   row.worthiness,
  mentalHealth: row.mental_health,
  mentalHealthMax: row.mental_health_max,
  stats:        row.stats        || [],
  skills:       row.skills       || [],
  inventory:    row.inventory    || [],
  notes:        row.notes        || "",
  _transforms:  row.transformations || [],
  abilities:    (() => { const a = {...(row.abilities||{})}; delete a._description; return a; })(),
  description:  (row.abilities && row.abilities._description) || "",
  continent:    row.continent,
  languages:    row.languages    || [],
  classes:      row.classes      || [],
  raceTraits:   row.race_traits  || [],
  weapons:      row.weapons      || [],
  customFields: row.custom_fields|| [],
  mbti:         row.mbti,
  moral:        row.moral,
  animalType:   row.animal_type,
  eyeType:      row.eye_type,
  dragonParts:  row.dragon_parts || [],
  dragonDegree: row.dragon_degree,
  souls:        row.souls,
  soulType:     row.soul_type,
  coreQuality:  row.core_quality,
  savedAt:      row.created_at ? new Date(row.created_at).toLocaleString("ar-SA") : "",
});

/* ═══ قائمة الشخصيات (cache) — يُملأ عند init ═══ */
let _cachedProfiles = null;

async function fetchAmazadProfiles(){
  // 1. جلب الشخصيات المحلية أولاً (ما حُفظ على الجهاز)
  //    أ) الشخصيات "محلية فقط" التي حفظها المستخدم من مولّد أمازاد (amazad_local_profiles)
  //    ب) كاش/نسخة احتياطية قديمة (amazad_profiles أو amazad_v1) — للتوافق مع نسخ سابقة
  let localOnlyProfiles = [];
  try{
    const raw = localStorage.getItem(LOCAL_ONLY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    localOnlyProfiles = Array.isArray(parsed) ? parsed : (parsed.profiles || []);
  }catch(e){}

  let legacyProfiles = [];
  try{
    const raw = localStorage.getItem("amazad_profiles") || localStorage.getItem("amazad_v1");
    const parsed = raw ? JSON.parse(raw) : [];
    legacyProfiles = Array.isArray(parsed) ? parsed : (parsed.profiles || []);
  }catch(e){}

  // دمج المحليّين: الأولوية لـ amazad_local_profiles لأنه المصدر الفعلي والأحدث
  const localIds = new Set(localOnlyProfiles.map(p=>String(p.saveId||p.id)));
  const localProfiles = [...localOnlyProfiles, ...legacyProfiles.filter(p=>!localIds.has(String(p.saveId||p.id)))];

  // 2. جلب الشخصيات العامة من Supabase
  let remoteProfiles = [];
  try{
    const { data, error } = await _sb
      .from("characters")
      .select("*")
      .order("created_at", { ascending: false });
    if(error) throw error;
    remoteProfiles = data.map(row => {
      const npc = rowToNpc(row);
      if(row.image_url){
        try{ localStorage.setItem('amazad_img_' + row.id, row.image_url); }catch(e){}
      }
      return npc;
    });
  }catch(e){
    console.warn("Supabase fetch failed:", e.message);
  }

  // 3. دمج: الشخصيات المحلية التي لا توجد في Supabase تُضاف
  const remoteIds = new Set(remoteProfiles.map(p=>String(p.saveId||p.id)));
  const localOnly = localProfiles.filter(p=>!remoteIds.has(String(p.saveId||p.id)));

  _cachedProfiles = [...remoteProfiles, ...localOnly];

  // حفظ محلي كـ fallback
  try{ localStorage.setItem("amazad_profiles", JSON.stringify(_cachedProfiles)); }catch(e){}
  return _cachedProfiles;
}


/* ═══ STATE ═══ */

  mapSrc:    null,

/* ═══════════════════════════════════════
   SESSIONS + PERSISTENCE
   كل جلسة = خريطة + شخصيات + إعدادات الشبكة، وتُحفظ منفصلة عن غيرها.
   التخزين في IndexedDB لأن الخرائط صور كبيرة لا تتسع في localStorage،
   مع رجوع تلقائي إلى localStorage إن لم يتوفر IndexedDB.
═══════════════════════════════════════ */
const SESS_INDEX_KEY  = 'amazad_bf_sessions_index_v1';
const SESS_ACTIVE_KEY = 'amazad_bf_active_session_v1';
const SESS_LS_PREFIX  = 'amazad_bf_sess_';
const IDB_NAME  = 'amazad_battlefield';
const IDB_STORE = 'sessions';

let sessions = [];            // [{id,name,createdAt,updatedAt,cols,rows,tokens,hasMap}]
let activeSessionId = null;
let _idbPromise = null;

/* ══ قاعدة الأرقام العشرية ══
   خانة عشرية واحدة كحد أقصى، بالقطع لا بالتقريب (5÷3 ← 1.6 وليس 1.7)، وبلا أصفار زائدة (2.0 ← 2).
   trunc1 ترجع رقماً (للحساب والتخزين)، وfmt1 ترجع نصاً (للعرض).
   استثناء: قيمة Y في التقنيات تبقى بدقتها الكاملة (خانتان). */
const trunc1 = (v) => {
  const n = Number(v);
  if(!isFinite(n)) return 0;
  const r = n < 0 ? -Math.floor(-n*10 + 1e-7)/10 : Math.floor(n*10 + 1e-7)/10;
  return r === 0 ? 0 : r;
};
const fmt1 = (v) => { const n = Number(v); return isFinite(n) ? String(trunc1(n)) : String(v); };

const DEFAULT_STATE = () => ({
  mapSrc:null, mapW:0, mapH:0, mapNatW:0, mapNatH:0,
  gridCols:20, gridRows:20, cellPx:60, gridVis:true,
  gridColor:'rgba(200,30,30,0.65)', gridBorderColor:'rgba(255,30,30,0.95)',
  panSensitivity:1.0, tokens:[], pan:{x:0,y:0}, zoom:1.0, tool:'move',
  combat:{cycle:0, parts:[], order:[], current:-1, log:[]},
});

function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('IndexedDB unavailable')); return; }
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = ()=>{ rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror   = ()=>rej(rq.error);
    rq.onblocked = ()=>rej(new Error('IndexedDB blocked'));
  });
  return _idbPromise;
}
async function idbPut(key, val){
  const db = await idbOpen();
  await new Promise((res,rej)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=>res();
    tx.onerror = tx.onabort = ()=>rej(tx.error || new Error('IndexedDB write failed'));
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const rq = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror   = ()=>rej(rq.error);
  });
}
async function sessPut(id, data){
  try{
    await idbPut(id, data);
  }catch(e){
    // بديل: localStorage (يرمي خطأ إن امتلأت المساحة، فيظهر تنبيه الحفظ)
    localStorage.setItem(SESS_LS_PREFIX+id, JSON.stringify(data));
  }
}
async function sessGet(id){
  try{
    const v = await idbGet(id);
    if(v) return v;
  }catch(e){}
  try{ const raw = localStorage.getItem(SESS_LS_PREFIX+id); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function sessDel(id){
  try{
    const db = await idbOpen();
    await new Promise((res,rej)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = ()=>res();
      tx.onerror = tx.onabort = ()=>rej(tx.error);
    });
  }catch(e){}
  try{ localStorage.removeItem(SESS_LS_PREFIX+id); }catch(e){}
}

let _metaChain = Promise.resolve();
function persistSessionIndex(){
  try{ localStorage.setItem(SESS_INDEX_KEY, JSON.stringify(sessions)); }catch(e){}
  try{ localStorage.setItem(SESS_ACTIVE_KEY, activeSessionId || ''); }catch(e){}
  // نسخة احتياطية من الفهرس داخل IndexedDB (أثبت من localStorage): حتى لو ضاع الفهرس المحلي لا تُفقد الجلسات
  const snap = {sessions:cloneJson(sessions), active:activeSessionId};
  _metaChain = _metaChain.then(()=>idbPut('__index__', snap)).catch(()=>{});
}
function newSessionRecord(name){
  return {
    id: 's_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name, createdAt: Date.now(), updatedAt: Date.now(),
    cols:20, rows:20, tokens:0, hasMap:false,
  };
}
function sessionMetaFrom(d){
  return { cols:d?.gridCols||20, rows:d?.gridRows||20, tokens:(d?.tokens||[]).length, hasMap:!!d?.mapSrc };
}
function getActiveSession(){ return sessions.find(s=>s.id===activeSessionId) || null; }
function nextSessionName(){
  let n = sessions.length + 1;
  while(sessions.some(s=>s.name==='الجلسة '+n)) n++;
  return 'الجلسة '+n;
}
function cloneJson(v){
  try{ return structuredClone(v); }catch(e){ return JSON.parse(JSON.stringify(v)); }
}
const _escS = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* لقطة من الحالة الحالية (تُنسخ فوراً حتى لا تتأثر بتغييرات لاحقة أو بتبديل الجلسة) */
function snapshotState(){
  return {
    mapSrc:state.mapSrc, mapW:state.mapW, mapH:state.mapH, mapNatW:state.mapNatW, mapNatH:state.mapNatH,
    gridCols:state.gridCols, gridRows:state.gridRows, cellPx:state.cellPx, gridVis:state.gridVis,
    gridColor:state.gridColor, gridBorderColor:state.gridBorderColor,
    tokens:cloneJson(state.tokens), pan:{...state.pan}, zoom:state.zoom,
    combat:cloneJson(state.combat||{cycle:0,parts:[],order:[],current:-1,log:[]}),
  };
}

/* الحفظ مؤجَّل 250ms لتجميع التغييرات المتلاحقة (تحريك/تكبير) ثم يُكتب على الجلسة النشطة */
let _saveTimer = null, _savePending = false, _saveChain = Promise.resolve();
function saveBfState(){
  _savePending = true;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(flushBfState, 250);
}
function flushBfState(){
  clearTimeout(_saveTimer);
  if(!_savePending || !activeSessionId) return _saveChain;
  _savePending = false;
  const id = activeSessionId;
  const data = snapshotState();
  _saveChain = _saveChain
    .then(()=>sessPut(id, data))
    .then(()=>{
      const s = sessions.find(x=>x.id===id);
      if(s){ Object.assign(s, sessionMetaFrom(data), {updatedAt:Date.now()}); persistSessionIndex(); }
    })
    .catch(e=>{ console.warn('save failed', e); showToast('⚠ فشل الحفظ: مساحة التخزين ممتلئة'); });
  return _saveChain;
}

/* تطبيق بيانات جلسة على الحالة الحية */
function loadSessionData(data){
  const keepSens = state.panSensitivity, keepTool = state.tool;
  Object.assign(state, DEFAULT_STATE(), data || {});
  state.panSensitivity = keepSens || 1.0;   // تفضيل عام لا يخص الجلسة
  state.tool = keepTool || 'move';
  // تأكد أن الشبكة دائماً لها أبعاد
  if(!state.mapW || !state.mapH){
    state.mapW = state.gridCols * state.cellPx;
    state.mapH = state.gridRows * state.cellPx;
  }
}

async function initSessions(){
  try{
    const parsed = JSON.parse(localStorage.getItem(SESS_INDEX_KEY) || '[]');
    sessions = Array.isArray(parsed) ? parsed : [];
  }catch(e){ sessions = []; }
  activeSessionId = localStorage.getItem(SESS_ACTIVE_KEY) || null;
  // دمج نسخة الفهرس المحفوظة في IndexedDB (تعيد الجلسات الناقصة، والأحدث تفوز)
  try{
    const meta = await idbGet('__index__');
    if(meta && Array.isArray(meta.sessions)){
      const byId = new Map(sessions.map(s=>[s.id,s]));
      meta.sessions.forEach(s=>{
        const cur = byId.get(s.id);
        if(!cur || (s.updatedAt||0) > (cur.updatedAt||0)) byId.set(s.id, s);
      });
      sessions = [...byId.values()];
      if(!activeSessionId) activeSessionId = meta.active || null;
    }
  }catch(e){}

  let legacy = null;
  if(!sessions.length){
    // ترحيل الحفظ القديم (خريطة واحدة) إلى الجلسة الأولى — المفتاح القديم يبقى كما هو دون مسح
    try{ const raw = localStorage.getItem(BF_KEY); if(raw) legacy = JSON.parse(raw); }catch(e){}
    const first = newSessionRecord('الجلسة 1');
    if(legacy) Object.assign(first, sessionMetaFrom(legacy));
    sessions = [first];
    activeSessionId = first.id;
    if(legacy){ try{ await sessPut(first.id, legacy); }catch(e){ console.warn('migration write failed', e); } }
    persistSessionIndex();
  }
  if(!sessions.some(s=>s.id===activeSessionId)){
    activeSessionId = sessions[0].id;
    persistSessionIndex();
  }
  let data = null;
  try{ data = await sessGet(activeSessionId); }catch(e){}
  loadSessionData(data || legacy);
}

/* عرض جلسة على الواجهة بعد تبديلها */
function applySessionToUI(data){
  if(typeof closeCombatPanel==="function") closeCombatPanel();
  closeAllPopups();
  clearAttackRanges();
  document.querySelectorAll('#dmg-popups-layer .dmg-popup').forEach(e=>e.remove());
  selectedTokenId = null;
  loadSessionData(data);
  renderAll();
  if(!data || !data.pan) zoomFit();
}

async function switchSession(id, keepModal){
  if(id === activeSessionId){ if(!keepModal) closeModal(); return; }
  if(!sessions.some(s=>s.id===id)) return;
  await flushBfState();                       // احفظ الجلسة الحالية قبل مغادرتها
  let data = null;
  try{ data = await sessGet(id); }catch(e){}
  activeSessionId = id;
  persistSessionIndex();
  applySessionToUI(data);
  if(!keepModal) closeModal();
  showToast('📁 '+(getActiveSession()?.name||''));
}

async function createSessionFromInput(){
  const inp = document.getElementById('sess-new-name');
  const name = (inp?.value || '').trim() || nextSessionName();
  await flushBfState();
  const rec = newSessionRecord(name);
  sessions.push(rec);
  activeSessionId = rec.id;
  persistSessionIndex();
  applySessionToUI(null);
  try{ await sessPut(rec.id, snapshotState()); }catch(e){}
  closeModal();
  showToast('📁 جلسة جديدة: '+name);
  openMapSetup();                              // الخطوة التالية الطبيعية: تحميل خريطة الجلسة
}

function renameSession(id){
  const s = sessions.find(x=>x.id===id); if(!s) return;
  const name = (prompt('اسم الجلسة:', s.name) || '').trim();
  if(!name) return;
  s.name = name;
  persistSessionIndex();
  renderSessionsList();
  updateHeaderSub();
}

async function duplicateSession(id){
  const s = sessions.find(x=>x.id===id); if(!s) return;
  await flushBfState();
  const data = (id === activeSessionId) ? snapshotState() : await sessGet(id);
  const rec = newSessionRecord(s.name+' (نسخة)');
  Object.assign(rec, sessionMetaFrom(data));
  try{ await sessPut(rec.id, cloneJson(data || {})); }
  catch(e){ showToast('⚠ فشل النسخ: مساحة التخزين ممتلئة'); return; }
  sessions.push(rec);
  persistSessionIndex();
  renderSessionsList();
  showToast('⧉ تم نسخ الجلسة');
}

async function deleteSession(id){
  const s = sessions.find(x=>x.id===id); if(!s) return;
  if(sessions.length <= 1){ showToast('⚠ لا يمكن حذف الجلسة الوحيدة'); return; }
  if(!confirm(`حذف الجلسة «${s.name}» نهائياً مع خريطتها وشخصياتها؟`)) return;
  if(id === activeSessionId){
    const other = sessions.find(x=>x.id!==id);
    await switchSession(other.id, true);
  }
  sessions = sessions.filter(x=>x.id!==id);
  await sessDel(id);
  persistSessionIndex();
  renderSessionsList();
  updateHeaderSub();
  showToast('🗑 تم حذف الجلسة');
}

function renderSessionsList(){
  const wrap = document.getElementById('sess-list');
  if(!wrap) return;
  const list = [...sessions].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  wrap.innerHTML = list.map(s=>{
    const active = s.id === activeSessionId;
    const m = active ? sessionMetaFrom(state) : s;    // الجلسة الحالية تُعرض من الحالة الحية
    let when = '';
    try{ when = s.updatedAt ? new Date(s.updatedAt).toLocaleString('ar-SA') : ''; }catch(e){}
    return `
      <div class="sess-item${active?' active':''}">
        <div class="sess-main" onclick="switchSession('${s.id}')">
          <div class="sess-name">${active?'● ':''}${_escS(s.name)}</div>
          <div class="sess-sub">${m.hasMap?'🗺':'⬜ بلا خريطة'} ${m.cols}×${m.rows} • ${m.tokens} شخصيات${when?' • '+when:''}</div>
        </div>
        <div class="sess-actions">
          <button title="إعادة تسمية" onclick="renameSession('${s.id}')">✏</button>
          <button title="نسخ الجلسة" onclick="duplicateSession('${s.id}')">⧉</button>
          <button title="حذف" class="danger" onclick="deleteSession('${s.id}')">🗑</button>
        </div>
      </div>`;
  }).join('');
}

function renderAll(){

function applyTransform(){
  bfCanvas.style.transform = `translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom})`;
  bfCanvas.style.transformOrigin = '0 0';
  updateTokenLabelScales();
  if(attackRangeState) _drawAttackRange();   // أزرار النطاق تحافظ على حجمها على الشاشة عند التكبير
}

function renderMap(){
  // احسب أبعاد الشبكة أولاً
  if(!state.mapW || !state.mapH){
    state.mapW = state.gridCols * state.cellPx;
    state.mapH = state.gridRows * state.cellPx;
  }
  const W = state.mapW, H = state.mapH;

  // اضبط حجم bf-canvas دائماً حتى تكون الشبكة مرئية
  bfCanvas.style.width  = W + 'px';
  bfCanvas.style.height = H + 'px';

  if(state.mapSrc){
    mapImg.src = state.mapSrc;
    mapImg.style.display = 'block';
    mapImg.style.width  = W + 'px';
    mapImg.style.height = H + 'px';
    document.getElementById('empty-bf').style.display = 'none';
  } else if(W && H){
    // شبكة بدون صورة — خلفية داكنة شبه شفافة
    mapImg.style.display = 'none';
    document.getElementById('empty-bf').style.display = 'none';
    bfCanvas.style.background = '#0d1020';
  } else {
    mapImg.style.display = 'none';
    document.getElementById('empty-bf').style.display = 'flex';
    bfCanvas.style.background = '';
  }
}

/* ── عناصر الشبكة ── */
const gridCanvas = document.getElementById('grid-canvas-overlay');
const gridCtx    = gridCanvas ? gridCanvas.getContext('2d') : null;

function renderGrid(){
  if(!gridCtx){ return; }

  // احسب أبعاد الشبكة
  if(!state.mapW || !state.mapH){
    state.mapW = state.gridCols * state.cellPx;
    state.mapH = state.gridRows * state.cellPx;
  }
  const W = state.mapW, H = state.mapH;

  // دائماً اضبط حجم الـ canvas على حجم الشبكة
  gridCanvas.width  = W || state.gridCols * state.cellPx;
  gridCanvas.height = H || state.gridRows * state.cellPx;
  gridCanvas.style.width  = gridCanvas.width  + 'px';
  gridCanvas.style.height = gridCanvas.height + 'px';

  // امسح
  gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);

  if(!state.gridVis) return;

  const cols = state.gridCols, rows = state.gridRows;
  const cp   = state.cellPx;

  // استخرج اللون من state (rgba أو hex)
  const rawClr = state.gridColor || 'rgba(200,30,30,0.65)';
  const borderClr = state.gridBorderColor || rawClr.replace(/[\d.]+\)$/, '0.95)');

  // رسم الخطوط الداخلية
  gridCtx.save();
  gridCtx.strokeStyle = rawClr;
  gridCtx.lineWidth = 1;

  for(let c = 1; c < cols; c++){
    const x = c * cp + 0.5;
    gridCtx.beginPath();
    gridCtx.moveTo(x, 0);
    gridCtx.lineTo(x, H);
    gridCtx.stroke();
  }
  for(let r = 1; r < rows; r++){
    const y = r * cp + 0.5;
    gridCtx.beginPath();
    gridCtx.moveTo(0, y);
    gridCtx.lineTo(W, y);
    gridCtx.stroke();
  }

  // رسم الحدود الخارجية بخط أسمك
  gridCtx.strokeStyle = borderClr;
  gridCtx.lineWidth = 2.5;
  gridCtx.strokeRect(0.5, 0.5, W - 1, H - 1);

  // تسميات الإحداثيات كل 5 خلايا
  gridCtx.fillStyle = rawClr.replace(/[\d.]+\)$/, '0.7)');
  gridCtx.font = '10px monospace';
  gridCtx.textBaseline = 'top';
  for(let c = 0; c <= cols; c += 5){
    for(let r = 0; r <= rows; r += 5){
      if(c === 0 && r === 0) continue;
      gridCtx.fillText(`${c},${r}`, c * cp + 2, r * cp + 2);
    }
  }

  gridCtx.restore();
}

function renderTokens(){
  document.querySelectorAll('.token').forEach(el=>el.remove());
  if(!state.mapSrc) return;
  state.tokens.forEach(tok => renderToken(tok));
  // keep label sizes in sync with current zoom
  updateTokenLabelScales();
}

function renderToken(tok){
  const el = document.createElement('div');
  el.className = 'token' + (tok.id===selectedTokenId?' selected':'');
  el.id = 'tok_'+tok.id;
  el.style.left = tok.x + 'px';
  el.style.top  = tok.y + 'px';

  // token size: (charSize / 100) * cellPx — this is the ICON diameter in map-px
  const sizeRatio = Math.max(0.3, (tok.charSize||100) / 100);
  const tokPx = sizeRatio * state.cellPx;

  // avatar
  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'token-avatar' + (!getCharImage(tok.profileId)?' no-img':'');
  avatarDiv.style.width    = tokPx + 'px';
  avatarDiv.style.height   = tokPx + 'px';
  avatarDiv.style.fontSize = (tokPx * 0.48) + 'px';
  avatarDiv.style.borderColor = tok.raceColor || '#7c3aed';
  // مركز الأفاتار = نقطة الحاوية؛ الاسم والبارات يلتصقان بحافتيه العلوية والسفلية
  avatarDiv.style.left = (-tokPx/2) + 'px';
  avatarDiv.style.top  = (-tokPx/2) + 'px';
  el.dataset.half = String(tokPx/2);

  const imgSrc = getCharImage(tok.profileId);
  if(imgSrc){
    const img = document.createElement('img');
    img.src = imgSrc;
    img.draggable = false;
    avatarDiv.appendChild(img);
  } else {
    avatarDiv.textContent = tok.emoji || '⚔';
  }

  // name label — will be counter-scaled vs zoom
  const nameDiv = document.createElement('div');
  nameDiv.className = 'token-name';
  nameDiv.textContent = tok.name || '؟';

  // stat bars label — also counter-scaled
  const barsDiv = document.createElement('div');
  barsDiv.className = 'token-bars';
  let barsHTML = buildMiniBar('❤', tok.hp, tok.hpMax, '#ef4444')
    + buildMiniBar('✨', tok.hala, tok.halaMax, '#a855f7')
    + buildMiniBar('⚡', tok.stamina, tok.staminaMax, '#f59e0b');
  // بارات صحة إضافية
  if(tok.extraBars && tok.extraBars.length > 0){
    tok.extraBars.forEach(bar=>{
      barsHTML += buildMiniBar('❤', bar.current??bar.max??0, bar.max||1, bar.color||'#f97316');
    });
  }
  barsDiv.innerHTML = barsHTML;

  el.appendChild(avatarDiv);
  el.appendChild(barsDiv);
  el.appendChild(nameDiv);   // الاسم آخراً وبأعلى z-index: فوق كل البارات

  el.addEventListener('click', ev => { ev.stopPropagation(); openBattlePopup(tok.id); });
  el.addEventListener('mousedown', ev => { startTokenDrag(ev, tok.id); });
  el.addEventListener('touchstart', ev => { startTokenDrag(ev, tok.id); }, {passive:false});

  bfCanvas.appendChild(el);
  layoutTokenLabels(el);
  if(typeof combatCurrentTokId==='function' && combatCurrentTokId()===tok.id) el.classList.add('turn-active');
}

/* الاسم يكبر للأعلى (أصله عند حافته السفلية فوق الأفاتار) والبارات تكبر للأسفل (أصلها عند حافتها العلوية)،
   فيبقى كلٌّ منهما ملتصقاً بمكانه مهما كان التكبير/التصغير. gap ثابت بالبكسل على الشاشة. */
/* تفضيلات عرض عامة (لا تتبع جلسة بعينها): حجم الإحصائيات تحت الشخصيات + إخفاؤها */
const UI_PREFS_KEY = 'amazad_bf_ui_prefs_v1';
const uiPrefs = { barScale:1, barsHidden:false };
function loadUiPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem(UI_PREFS_KEY)||'{}');
    if(typeof o.barScale==='number' && o.barScale>=0.5 && o.barScale<=3) uiPrefs.barScale = o.barScale;
    uiPrefs.barsHidden = !!o.barsHidden;
  }catch(e){}
}
function saveUiPrefs(){ try{ localStorage.setItem(UI_PREFS_KEY, JSON.stringify(uiPrefs)); }catch(e){} }
function applyBarPrefs(){
  const cv = document.getElementById('bf-canvas') || bfCanvas;
  if(cv) cv.classList.toggle('bars-hidden', uiPrefs.barsHidden);
  const v = document.getElementById('bars-scale-val'); if(v) v.textContent = Math.round(uiPrefs.barScale*100)+'%';

  if(hb){ hb.classList.toggle('on', uiPrefs.barsHidden); hb.textContent = uiPrefs.barsHidden ? '👁 إظهار الإحصائيات' : '🙈 إزالة الإحصائيات'; }
  document.getElementById('bars-panel')?.classList.toggle('disabled', uiPrefs.barsHidden);

}
function changeBarScale(d){
  uiPrefs.barScale = Math.max(0.5, Math.min(3, Math.round((uiPrefs.barScale + d)*10)/10));
  saveUiPrefs(); applyBarPrefs();
}
function resetBarScale(){ uiPrefs.barScale = 1; saveUiPrefs(); applyBarPrefs(); }
function toggleBarsHidden(){ uiPrefs.barsHidden = !uiPrefs.barsHidden; saveUiPrefs(); applyBarPrefs(); }
function toggleBarsPanel(){
  const p = document.getElementById('bars-panel'); if(!p) return;
  p.hidden = !p.hidden;
}
document.addEventListener('pointerdown', e=>{   // إغلاق اللوحة عند الضغط خارجها
  const p = document.getElementById('bars-panel'); if(!p || p.hidden) return;

function layoutTokenLabels(tokEl){
  const inv  = 1 / state.zoom;
  const half = parseFloat(tokEl.dataset.half) || 0;
  const gap  = 3 * inv;
  const nm = tokEl.querySelector('.token-name');
  const br = tokEl.querySelector('.token-bars');
  if(nm){
    nm.style.top = (-half) + 'px';
    nm.style.transformOrigin = '50% 100%';
    nm.style.transform = `translate(-50%, calc(-100% - ${gap}px)) scale(${inv})`;
  }
  if(br){
    br.style.top = half + 'px';
    br.style.transformOrigin = '50% 0';
    br.style.transform = `translate(-50%, ${gap}px) scale(${inv * uiPrefs.barScale})`;
  }
}
function updateTokenLabelScales(){
  document.querySelectorAll('.token').forEach(layoutTokenLabels);
}

const _pctOf = (cur, max) => max>0 ? Math.max(0, Math.min(100, (cur/max)*100)) : 0;

/* بار مصغّر على التوكن: القيمة الحالية + نسبة الامتلاء (للصحة والهالة والستامينا) */
function buildMiniBar(icon, cur, max, color){
  const pct = _pctOf(cur, max);
  return `<div class="token-bar-row">
    <span style="color:${color};font-size:8px;">${icon}</span>
    <div class="token-bar-track"><div class="token-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    <span class="token-bar-val" style="color:${color};">${fmt1(cur)} <span class="token-bar-pct">${Math.floor(pct)}%</span></span>
  </div>`;
}
const buildMiniBarPct = buildMiniBar;   // للتوافق: الستامينا صارت تعرض القيمة + النسبة كغيرها

/* قيمة البار داخل نافذة الشخصية: حالي/أقصى + النسبة */
function bpValHTML(cur, max){
  return `${fmt1(cur)}/${fmt1(max)} <span class="bp-pct">${Math.floor(_pctOf(cur, max))}%</span>`;
}
